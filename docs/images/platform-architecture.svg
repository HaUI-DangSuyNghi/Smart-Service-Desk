<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc"><title id="title">Kiến trúc ba tầng Smart Service Desk</title><desc id="desc">Người dùng đăng nhập qua Keycloak, giao diện React gọi API qua Apache APISIX. Ứng dụng Service Desk và Đặt phòng sử dụng H-P-D-I, lõi kỹ thuật và runtime Python Intelligence. Hạ tầng gồm PostgreSQL và kho tệp.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#637857" stroke-width="1.5"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce5d6"/></pattern></defs><rect width="1120" height="900" rx="24" fill="#f6f8f3"/><rect width="1120" height="900" rx="24" fill="url(#grid)" opacity="0.4"/><g font-family="Segoe UI, DejaVu Sans, sans-serif">
