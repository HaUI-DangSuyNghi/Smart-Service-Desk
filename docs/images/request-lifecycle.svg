<path d="M708 213 H770" fill="none" stroke="#637857" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M932 276 V334" fill="none" stroke="#637857" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M784 411 H722" fill="none" stroke="#637857" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M412 411 H350" fill="none" stroke="#637857" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M560 474 V518 H1100 V213 H1080" fill="none" stroke="#637857" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="666" y="509" font-size="13" fill="#60754d" font-weight="600">Yêu cầu làm lại → duyệt và giao</text>
<text x="42" y="554" font-size="13" fill="#607063" font-weight="400">AI hỗ trợ phân loại khi được bật; quyết định duyệt và phân công thuộc về điều phối viên.</text>
</g></svg>