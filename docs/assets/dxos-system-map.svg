<text x="52" y="104" fill="#0B2346" font-size="43" font-weight="800" >Kiến trúc ba tầng DX-OS</text>
<text x="54" y="139" fill="#60718C" font-size="22" font-weight="400" >Ba tầng độc lập về trách nhiệm. Một chiều phụ thuộc. Hợp đồng API rõ ràng.</text>
