<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="910" viewBox="0 0 1600 910" role="img" aria-labelledby="title desc">
<title id="title">Smart Service Desk — DX-OS three-tier architecture</title>
<desc id="desc">Three stacked horizontal architecture tiers: Domain Applications at top, H-P-D-I shared capabilities in the middle, Headless Core at bottom. Dependencies point downward only. Infrastructure is outside the tier model.</desc>
<style>text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}</style>
