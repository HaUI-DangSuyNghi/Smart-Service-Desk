<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">Smart Service Desk — ticket lifecycle</title>
<desc id="desc">Five-stage left-to-right human-controlled ticket lifecycle with optional AI advisory and manual fallback. No automatic ticket merges or approval are implied.</desc>
<style>text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}</style>
<rect width="1600" height="700" fill="#FFFFFF"/>
<text x="52" y="54" fill="#176BD7" font-size="18" font-weight="750" letter-spacing="2.1">SMART SERVICE DESK  /  REQUEST LIFECYCLE</text>
<text x="52" y="107" fill="#102747" font-size="41" font-weight="800" >Một ticket. Một quy trình. Một nguồn sự thật.</text>
<text x="54" y="146" fill="#6A7B94" font-size="21" font-weight="400" >Người dùng và điều phối viên giữ quyền quyết định. AI chỉ hỗ trợ tại các điểm được cấu hình.</text>
