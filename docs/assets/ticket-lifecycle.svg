  <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0"/></symbol>
  <symbol id="i-flow" viewBox="0 0 24 24"><rect x="2" y="2" width="7" height="7" rx="2"/><rect x="15" y="15" width="7" height="7" rx="2"/><rect x="2" y="15" width="7" height="7" rx="2"/><path d="M9 5h5a4 4 0 0 1 4 4v6M5 9v6"/></symbol>
