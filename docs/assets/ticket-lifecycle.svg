<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" font-family="Inter,Segoe UI,Arial,sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Smart Service Desk · Ticket processing state flow</title>
<desc id="desc">A compact process diagram showing intake, AI advisory, human coordinator review, technician execution, and user confirmation, with manual-review and rework branches.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#EDF1F7" stroke-width=".7"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#8799AE"/></marker><marker id="violet" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#8066C5"/></marker><marker id="amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#D38B34"/></marker></defs><rect x="0" y="0" width="1440" height="680" rx="0" fill="#F9FBFE" stroke="none"/><rect x="0" y="0" width="1440" height="680" rx="0" fill="url(#grid)" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#13213A" stroke="none"/><text x="46" y="32" font-size="13" fill="#9CB9E4" font-weight="800" letter-spacing="2">SMART SERVICE DESK</text><text x="46" y="60" font-size="23" fill="#F8FAFC" font-weight="730" >Ticket lifecycle / decision boundaries</text><rect x="1195" y="25" width="197" height="29" rx="5" fill="#223853" stroke="#455B79"/><text x="1207" y="45" font-size="12" fill="#D9E7FB" font-weight="760" letter-spacing=".6">HUMAN-IN-THE-LOOP</text><text x="47" y="121" font-size="12" fill="#60758F" font-weight="800" letter-spacing="1.6">PRIMARY PATH</text><text x="47" y="151" font-size="16" fill="#687A91" font-weight="500" >Each step records state and respects workspace permissions.</text><path d="M247 250 H272" fill="none" stroke="#8296AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M480 250 H505" fill="none" stroke="#8296AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M713 250 H738" fill="none" stroke="#8296AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M946 250 H971" fill="none" stroke="#8296AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1179 250 H1204" fill="none" stroke="#8296AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="46" y="183" width="201" height="139" rx="10" fill="#FFFFFF" stroke="#DCE5EF"/><rect x="46" y="183" width="201" height="6" rx="2" fill="#3278C6" stroke="none"/><rect x="62" y="204" width="35" height="30" rx="6" fill="#EDF5FF" stroke="#EDF5FF"/><text x="79" y="224" font-size="13" fill="#3278C6" font-weight="850" text-anchor="middle">01</text><text x="62" y="267" font-size="18" fill="#243146" font-weight="750" >Submit ticket</text><text x="62" y="297" font-size="13" fill="#6A7C91" font-weight="520" >Requester</text><rect x="279" y="183" width="201" height="139" rx="10" fill="#FFFFFF" stroke="#DCE5EF"/><rect x="279" y="183" width="201" height="6" rx="2" fill="#3278C6" stroke="none"/><rect x="295" y="204" width="35" height="30" rx="6" fill="#EDF5FF" stroke="#EDF5FF"/><text x="312" y="224" font-size="13" fill="#3278C6" font-weight="850" text-anchor="middle">02</text><text x="295" y="267" font-size="18" fill="#243146" font-weight="750" >Intake gate</text><text x="295" y="297" font-size="12" fill="#6A7C91" font-weight="520" >Context &amp; duplicate signals</text><rect x="512" y="183" width="201" height="139" rx="10" fill="#FFFFFF" stroke="#DCE5EF"/><rect x="512" y="183" width="201" height="6" rx="2" fill="#8066C5" stroke="none"/><rect x="528" y="204" width="35" height="30" rx="6" fill="#F8F5FF" stroke="#F8F5FF"/><text x="545" y="224" font-size="13" fill="#8066C5" font-weight="850" text-anchor="middle">03</text><text x="528" y="267" font-size="18" fill="#243146" font-weight="750" >AI advisory</text><text x="528" y="297" font-size="13" fill="#6A7C91" font-weight="520" >Classification / risk</text><rect x="745" y="183" width="201" height="139" rx="10" fill="#FFFFFF" stroke="#DCE5EF"/><rect x="745" y="183" width="201" height="6" rx="2" fill="#C48732" stroke="none"/><rect x="761" y="204" width="35" height="30" rx="6" fill="#FFFAF1" stroke="#FFFAF1"/><text x="778" y="224" font-size="13" fill="#C48732" font-weight="850" text-anchor="middle">04</text><text x="761" y="267" font-size="18" fill="#243146" font-weight="750" >Coordinator review</text><text x="761" y="297" font-size="13" fill="#6A7C91" font-weight="520" >Human decision</text><rect x="978" y="183" width="201" height="139" rx="10" fill="#FFFFFF" stroke="#DCE5EF"/><rect x="978" y="183" width="201" height="6" rx="2" fill="#0F9B79" stroke="none"/><rect x="994" y="204" width="35" height="30" rx="6" fill="#F0FBF7" stroke="#F0FBF7"/><text x="1011" y="224" font-size="13" fill="#0F9B79" font-weight="850" text-anchor="middle">05</text><text x="994" y="267" font-size="18" fill="#243146" font-weight="750" >Agent execution</text><text x="994" y="297" font-size="13" fill="#6A7C91" font-weight="520" >START / PAUSE / RESUME</text><rect x="1211" y="183" width="183" height="139" rx="10" fill="#FFFFFF" stroke="#DCE5EF"/><rect x="1211" y="183" width="183" height="6" rx="2" fill="#0F9B79" stroke="none"/><rect x="1227" y="204" width="35" height="30" rx="6" fill="#F0FBF7" stroke="#F0FBF7"/><text x="1244" y="224" font-size="13" fill="#0F9B79" font-weight="850" text-anchor="middle">06</text><text x="1227" y="267" font-size="18" fill="#243146" font-weight="750" >Confirm result</text><text x="1227" y="297" font-size="13" fill="#6A7C91" font-weight="520" >Requester decision</text><text x="47" y="367" font-size="12" fill="#60758F" font-weight="800" letter-spacing="1.6">DECISION PATHS</text><path d="M380 322 V405 H278 V433" fill="none" stroke="#8066C5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#violet)"/><path d="M614 322 V405 H614 V433" fill="none" stroke="#8066C5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#violet)"/><rect x="46" y="433" width="626" height="122" rx="12" fill="#F8F6FF" stroke="#D7CEF2"/><rect x="46" y="433" width="6" height="122" rx="2" fill="#8066C5" stroke="none"/><text x="69" y="460" font-size="12" fill="#7255B8" font-weight="850" letter-spacing="1">MANUAL REVIEW / ENRICHMENT</text><text x="69" y="492" font-size="19" fill="#243146" font-weight="700" >Missing context, uncertainty, or unverified duplicate</text><text x="69" y="524" font-size="14" fill="#60758F" font-weight="510" >No automatic merge · Request information or route to authorized reviewer</text><path d="M672 494 H770 V322" fill="none" stroke="#8066C5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#violet)"/><path d="M1303 322 V433" fill="none" stroke="#0C9B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="746" y="433" width="648" height="122" rx="12" fill="#F3FBF8" stroke="#C7E5D9"/><rect x="746" y="433" width="6" height="122" rx="2" fill="#119B7A" stroke="none"/><text x="770" y="461" font-size="12" fill="#087F65" font-weight="850" letter-spacing=".9">REQUESTER CONFIRMATION</text><rect x="770" y="478" width="255" height="53" rx="8" fill="#FFFFFF" stroke="#C7E5D9"/><text x="790" y="512" font-size="18" fill="#087F65" font-weight="740" >✓  Accepted → close</text><rect x="1045" y="478" width="326" height="53" rx="8" fill="#FFFFFF" stroke="#F0D8B3"/><text x="1065" y="512" font-size="18" fill="#AD721E" font-weight="740" >↺  Needs rework → agent</text><path d="M1208 555 V595 H1080 V322" fill="none" stroke="#D38B34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#amber)"/><rect x="46" y="612" width="1348" height="45" rx="8" fill="#EEF3FA" stroke="none"/><text x="63" y="641" font-size="14" fill="#314C69" font-weight="750" >Controls:</text><text x="140" y="641" font-size="13" fill="#5A718D" font-weight="500" >Intake and canonical linking are feature-gated · AI suggestions are advisory · final assessment must match the reviewed context revision.</text></svg>