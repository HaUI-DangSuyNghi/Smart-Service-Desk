<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc" font-family="Inter, Arial, Helvetica, sans-serif"><title id="title">Vòng đời ticket - Smart Service Desk</title><desc id="desc">Hành trình từ tạo ticket đến xử lý, xác nhận, với nhánh review thủ công và khả năng yêu cầu làm lại.</desc><defs>
