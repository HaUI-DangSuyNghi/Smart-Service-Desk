  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101C41"/><stop offset="1" stop-color="#263B77"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
