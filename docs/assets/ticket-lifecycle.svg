</defs><rect x="0" y="0" width="1600" height="840" rx="18" fill="url(#canvas)" stroke="none" /><rect x="0" y="0" width="1600" height="840" rx="18" fill="url(#dots)" stroke="none" /><rect x="0" y="0" width="1600" height="11" rx="18" fill="url(#brand)" stroke="none" /><text x="60" y="65" font-size="16" font-weight="850" fill="#4F46E5" letter-spacing="3">TICKET JOURNEY</text><text x="60" y="111" font-size="39" font-weight="790" fill="#122248" >Từ sự cố đến xử lý hoàn tất</text><text x="60" y="148" font-size="19" font-weight="430" fill="#526985" >Một vòng đời có kiểm soát: AI hỗ trợ — điều phối viên và người dùng giữ quyền quyết định.</text><rect x="1278" y="72" width="260" height="34" rx="17" fill="#E7EDFF" stroke="#C7D2FE" /><text x="1296" y="94" font-size="14" font-weight="700" fill="#4F46E5" letter-spacing=".5">HUMAN IN THE LOOP</text><path d="M 70 173 H 1530" fill="none" stroke="#D7E4F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 306 322 H 358" fill="none" stroke="#8194B3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 617 322 H 669" fill="none" stroke="#8194B3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 928 322 H 980" fill="none" stroke="#8194B3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 1239 322 H 1291" fill="none" stroke="#8194B3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="60" y="212" width="238" height="224" rx="24" fill="#FFFFFF" stroke="#DFE8F5" filter="url(#shadow)" stroke-width="1.4"/><rect x="60" y="212" width="6" height="224" rx="3" fill="#2563EB" stroke="none" /><circle cx="105" cy="261" r="24" fill="#DBEAFE" /><use href="#i-ticket" x="92" y="248" width="26" height="26" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="274" y="261" font-size="15" font-weight="800" fill="#2563EB" text-anchor="end" letter-spacing="1.2">01 / REQUESTER</text><text x="89" y="328" font-size="26" font-weight="750" fill="#152448" >Tạo ticket</text><text x="89" y="370" font-size="18" font-weight="500" fill="#536885" >Mô tả vấn đề</text><text x="89" y="396" font-size="18" font-weight="500" fill="#536885" >theo workspace</text><rect x="371" y="212" width="238" height="224" rx="24" fill="#FFFFFF" stroke="#DFE8F5" filter="url(#shadow)" stroke-width="1.4"/><rect x="371" y="212" width="6" height="224" rx="3" fill="#0891B2" stroke="none" /><circle cx="416" cy="261" r="24" fill="#CFFAFE" /><use href="#i-search" x="403" y="248" width="26" height="26" fill="none" stroke="#0891B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="585" y="261" font-size="15" font-weight="800" fill="#0891B2" text-anchor="end" letter-spacing="1.2">02 / INTAKE</text><text x="400" y="328" font-size="26" font-weight="750" fill="#152448" >Kiểm ngữ cảnh</text><text x="400" y="370" font-size="18" font-weight="500" fill="#536885" >Kiểm thông tin thiếu</text><text x="400" y="396" font-size="18" font-weight="500" fill="#536885" >&amp; trạng thái đầu vào</text><rect x="682" y="212" width="238" height="224" rx="24" fill="#FFFFFF" stroke="#DFE8F5" filter="url(#shadow)" stroke-width="1.4"/><rect x="682" y="212" width="6" height="224" rx="3" fill="#7C3AED" stroke="none" /><circle cx="727" cy="261" r="24" fill="#EDE9FE" /><use href="#i-sparkle" x="714" y="248" width="26" height="26" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="896" y="261" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="end" letter-spacing="1.2">03 / ADVISORY</text><text x="711" y="328" font-size="26" font-weight="750" fill="#152448" >AI đánh giá</text><text x="711" y="370" font-size="18" font-weight="500" fill="#536885" >Phân loại • tín hiệu</text><text x="711" y="396" font-size="18" font-weight="500" fill="#536885" >trùng • mức độ</text><rect x="993" y="212" width="238" height="224" rx="24" fill="#FFFFFF" stroke="#DFE8F5" filter="url(#shadow)" stroke-width="1.4"/><rect x="993" y="212" width="6" height="224" rx="3" fill="#D97706" stroke="none" /><circle cx="1038" cy="261" r="24" fill="#FEF3C7" /><use href="#i-users" x="1025" y="248" width="26" height="26" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1207" y="261" font-size="15" font-weight="800" fill="#D97706" text-anchor="end" letter-spacing="1.2">04 / REVIEW</text><text x="1022" y="328" font-size="26" font-weight="750" fill="#152448" >Phê duyệt</text><text x="1022" y="370" font-size="18" font-weight="500" fill="#536885" >Điều phối và</text><text x="1022" y="396" font-size="18" font-weight="500" fill="#536885" >gợi ý phân công</text><rect x="1304" y="212" width="238" height="224" rx="24" fill="#FFFFFF" stroke="#DFE8F5" filter="url(#shadow)" stroke-width="1.4"/><rect x="1304" y="212" width="6" height="224" rx="3" fill="#0F766E" stroke="none" /><circle cx="1349" cy="261" r="24" fill="#CCFBF1" /><use href="#i-tool" x="1336" y="248" width="26" height="26" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1518" y="261" font-size="15" font-weight="800" fill="#0F766E" text-anchor="end" letter-spacing="1.2">05 / AGENT</text><text x="1333" y="328" font-size="26" font-weight="750" fill="#152448" >Xử lý</text><text x="1333" y="370" font-size="18" font-weight="500" fill="#536885" >START / PAUSE</text><text x="1333" y="396" font-size="18" font-weight="500" fill="#536885" >/ RESUME</text><path d="M 801 436 V 475 H 302 V 520" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#arr-purple)"/><path d="M 1423 436 V 485 H 844 V 520" fill="none" stroke="#6685AB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 1020 610 H 1080" fill="none" stroke="#6685AB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="60" y="520" width="482" height="176" rx="23" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" filter="url(#shadow)"/><circle cx="98" cy="559" r="20" fill="#F3E8FF" /><use href="#i-alert" x="85" y="546" width="26" height="26" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="131" y="552" font-size="14" font-weight="800" fill="#7C3AED" letter-spacing="1.4">MANUAL GATE</text><text x="88" y="604" font-size="26" font-weight="750" fill="#172448" >Thiếu căn cứ?</text><text x="88" y="638" font-size="18" font-weight="450" fill="#526985" >Bổ sung ngữ cảnh hoặc chuyển người duyệt.</text><text x="88" y="667" font-size="17" font-weight="600" fill="#6D58A7" >Không tự hợp nhất ticket trùng.</text><rect x="662" y="520" width="358" height="176" rx="23" fill="#FFFFFF" stroke="#BFE8E3" stroke-width="1.5" filter="url(#shadow)"/><circle cx="703" cy="558" r="20" fill="#CCFBF1" /><use href="#i-clipboard" x="690" y="545" width="26" height="26" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="734" y="553" font-size="14" font-weight="850" fill="#0F766E" letter-spacing=".5">HOÀN THÀNH XỬ LÝ</text><text x="689" y="612" font-size="25" font-weight="750" fill="#172448" >Kỹ thuật viên báo xong</text><text x="689" y="650" font-size="18" font-weight="460" fill="#526985" >Kết quả và dấu vết được ghi nhận.</text><rect x="1080" y="520" width="460" height="176" rx="23" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#shadow)"/><circle cx="1120" cy="558" r="20" fill="#DBEAFE" /><use href="#i-check" x="1107" y="545" width="26" height="26" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1154" y="553" font-size="14" font-weight="850" fill="#1D4ED8" letter-spacing=".2">XÁC NHẬN CỦA NGƯỜI GỬI</text><text x="1109" y="611" font-size="25" font-weight="750" fill="#172448" >Đồng ý hay cần làm lại?</text><rect x="1109" y="636" width="169" height="34" rx="17" fill="#DCFCE7" stroke="#86EFAC" /><text x="1127" y="658" font-size="14" font-weight="700" fill="#047857" letter-spacing=".5">✓  ĐÓNG TICKET</text><rect x="1290" y="636" width="220" height="34" rx="17" fill="#FEF3C7" stroke="#FDE68A" /><text x="1308" y="658" font-size="14" font-weight="700" fill="#B45309" letter-spacing=".5">↻  YÊU CẦU LÀM LẠI</text><path d="M 1403 696 V 737 H 1562 V 330 H 1542" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arr)"/><text x="1440" y="755" font-size="15" font-weight="750" fill="#B45309" >Rework</text><rect x="60" y="776" width="1480" height="43" rx="13" fill="#E5EEFA" stroke="none" /><use href="#i-shield" x="83" y="786" width="23" height="23" fill="none" stroke="#475D88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="804" font-size="16" font-weight="600" fill="#445A78" >Nguyên tắc: không tự ra quyết định nghiệp vụ chỉ từ dự đoán AI; intake/canonical phụ thuộc cờ cấu hình và quyền được cấp.</text></svg>