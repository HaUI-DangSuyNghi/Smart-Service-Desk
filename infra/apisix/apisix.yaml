routes:
  - id: core
    uri: /api/core/v1/*
    plugins:
      limit-count:
        count: 300
        time_window: 60
        rejected_code: 429
        key: remote_addr
        policy: local
      # Chặn body > 6 MiB ngay ở gateway (backend vẫn giới hạn file 5 MiB) → 413
      client-control:
        max_body_size: 6291456
    upstream:
      type: roundrobin
      nodes:
        'platform:8080': 1
  - id: servicedesk
    uri: /api/apps/servicedesk/v1/*
    plugins:
      limit-count:
        count: 300
        time_window: 60
        rejected_code: 429
        key: remote_addr
        policy: local
      client-control:
        max_body_size: 6291456
    upstream:
      type: roundrobin
      nodes:
        'platform:8080': 1
  - id: hpdi
    uri: /api/hpdi/v1/*
    plugins:
      limit-count:
        count: 300
        time_window: 60
        rejected_code: 429
        key: remote_addr
        policy: local
      # Chặn body > 6 MiB ngay ở gateway (backend vẫn giới hạn file 5 MiB) → 413
      client-control:
        max_body_size: 6291456
    upstream:
      type: roundrobin
      nodes:
        'platform:8080': 1
  - id: health
    uri: /health
    plugins:
      proxy-rewrite:
        uri: /actuator/health
    upstream:
      type: roundrobin
      nodes:
        'platform:8080': 1
#END
