spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/core}
    username: core
    password: ${POSTGRES_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8081/realms/dx-lab}
          jwk-set-uri: ${JWT_JWKS:http://localhost:8081/realms/dx-lab/protocol/openid-connect/certs}
          audiences: dx-core
flowable:
  process-definition-location-prefix: classpath*:/apps/
  process-definition-location-suffixes: "**/process/*.bpmn20.xml"
  database-schema-update: true
  async-executor-activate: false
  history-level: full
dx:
  # Danh bạ workspace (Keycloak Admin API, service account dx-directory chỉ đọc user/group)
  directory:
    url: ${DX_DIRECTORY_URL:}
    realm: dx-lab
    client-id: dx-directory
    client-secret: ${DX_DIRECTORY_CLIENT_SECRET:}
  intelligence:
    triage:
      base-url: ${INTELLIGENCE_TRIAGE_BASE_URL:}
      token: ${INTELLIGENCE_TRIAGE_TOKEN:}
  storage:
    root: ${DX_STORAGE_ROOT:./.local/files}
    allow-unscanned-upload: ${DX_ALLOW_UNSCANNED_UPLOAD:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
serviceDesk:
  context:
    # true/false: bật hoặc tắt gợi ý ngữ cảnh và ticket trùng. Mặc định tắt.
    # Lưu câu trả lời bổ sung hoạt động độc lập, kể cả khi cờ này là false.
    enabled: ${SERVICE_DESK_CONTEXT_ENABLED:false}
    # DISABLED: tắt; SHADOW: chạy nhưng ẩn gợi ý; ASSISTED: gợi ý để người duyệt.
    # PROMOTED: chưa được phép sử dụng; backend từ chối chế độ này.
    mode: ${SERVICE_DESK_CONTEXT_MODE:DISABLED}
    # SHA-256 của bộ policy đang chạy; phải khớp grant được cấp độc lập.
    policy-bundle-digest: ${SERVICE_DESK_CONTEXT_POLICY_BUNDLE_DIGEST:}
    # Đường dẫn grant ký HMAC; scope OWN_TICKET hoặc WORKSPACE_REVIEW.
    processing-receipt: ${SERVICE_DESK_CONTEXT_PROCESSING_RECEIPT:}
    # Khóa xác minh HMAC (ít nhất 32 ký tự); chỉ đặt qua biến môi trường/bí mật triển khai.
    verification-key: ${SERVICE_DESK_CONTEXT_PROCESSING_VERIFICATION_KEY:}
  assessment:
    enabled: ${SERVICE_DESK_ASSESSMENT_ENABLED:false}
    policy-bundle-digest: ${SERVICE_DESK_ASSESSMENT_POLICY_BUNDLE_DIGEST:}
  classifier:
    mode: ${SERVICE_DESK_CLASSIFIER_MODE:DISABLED}
    provider: ${SERVICE_DESK_CLASSIFIER_PROVIDER:}
    model-digest: ${SERVICE_DESK_CLASSIFIER_MODEL_DIGEST:}
    policy-digest: ${SERVICE_DESK_CLASSIFIER_POLICY_DIGEST:}
    processing-receipt: ${SERVICE_DESK_CLASSIFIER_PROCESSING_RECEIPT:}
    processing-verification-key: ${SERVICE_DESK_CLASSIFIER_PROCESSING_VERIFICATION_KEY:}
intelligence:
  classification:
    base-url: ${INTELLIGENCE_CLASSIFICATION_BASE_URL:}
    token: ${INTELLIGENCE_CLASSIFICATION_TOKEN:}
server:
  error:
    include-message: never
logging:
  pattern:
    # Mỗi dòng log kèm requestId (đặt bởi RequestIdFilter) để tra theo X-Request-ID
    level: "%5p [%X{requestId:-}]"
