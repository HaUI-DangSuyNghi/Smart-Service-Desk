# Các Spring test context được cache đồng thời; không giữ 10 connection/context.
# Chỉ áp dụng cho test, không thay đổi pool hoặc SLO của ứng dụng triển khai.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
hpdi.alerts.scheduled=false
service-desk.alerts.scheduled=false
# Test cũ bật trực tay rồi mong được đề xuất/giao việc: giữ hành vi chưa có lịch thì theo công tắc tay.
# Hành vi "chỉ trực trong ca đã đăng ký" (mặc định khi chạy thật) có test riêng.
dx.scheduling.shift-required=false
