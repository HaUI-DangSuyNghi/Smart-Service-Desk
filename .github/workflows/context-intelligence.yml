name: Service Desk context intelligence

on:
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'contracts/apps/servicedesk/**'
      - 'scripts/apps/servicedesk/ai08/**'
      - '.github/workflows/context-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: synthetic-context-ci-only
          POSTGRES_DB: file_storage
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      FILE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/file_storage
      FILE_TEST_DB_PASSWORD: synthetic-context-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: intelligence/.python-version
      - name: Kiểm tra CPU, contract, ACL và PostgreSQL/Flowable thật
        working-directory: backend
        run: mvn -B '-Dtest=Context*Test,Duplicate*Test,Enrichment*Test,TicketContextualAssessmentIntegrationTest,TicketAssessmentInputAssemblerTest,ServiceDeskProcessStateTest,ServiceDeskMigrationIntegrationTest' test
      - name: Tổng hợp bằng chứng synthetic, không tuyên bố Gold
        run: python scripts/apps/servicedesk/ai08/evaluate-context.py --output .local/context-intelligence/receipt.json
      - name: Kiểm tra lifecycle, timeout và reassessment có revision
        run: python scripts/apps/servicedesk/ai08/verify-lifecycle-evidence.py --output .local/context-intelligence/lifecycle-receipt.json
      - name: Lưu receipt không chứa nội dung ticket
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-intelligence-synthetic-receipt
          path: .local/context-intelligence/*receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
