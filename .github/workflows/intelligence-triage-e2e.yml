name: Integrated current HEAD acceptance
on:
  pull_request:
    branches: [develop]
    paths: ['backend/**', 'intelligence/**', 'contracts/**', 'fixtures/intelligence/**', 'scripts/**', 'infra/**', 'compose*.yaml', '.dockerignore', '.env.example', 'docs/INT01*', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: int01-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  combined-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HDPI_PROFILE_ROOT: ${{ github.workspace }}/intelligence/src/apps/servicedesk/intelligence/profiles
      FILE_TEST_JDBC_URL: jdbc:postgresql://localhost:15432/file_storage
      WORKFLOW_TEST_JDBC_URL: jdbc:postgresql://localhost:15432/workflow_approval
      INTELLIGENCE_TRIAGE_BASE_URL: http://127.0.0.1:18000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: intelligence/.python-version
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: G10 clean checkout and source identity
        run: |
          test -z "$(git status --porcelain)"
          python scripts/security/export-inventory.py --self-test
          mkdir -p .local/int01
          git rev-parse HEAD | tee .local/int01/source-commit.txt
          echo "INT01_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "INT01_PROJECT=int01-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: G1 full Java and disposable PostgreSQL regression
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          export FILE_TEST_DB_PASSWORD="$password" WORKFLOW_TEST_DB_PASSWORD="$password" POSTGRES_PASSWORD="$password"
          printf 'FILE_TEST_DB_PASSWORD=%s\nWORKFLOW_TEST_DB_PASSWORD=%s\n' "$password" "$password" >> "$GITHUB_ENV"
          docker run -d --name "$INT01_PROJECT-regression" -e POSTGRES_USER=workflow -e POSTGRES_DB=file_storage -e POSTGRES_PASSWORD -p 127.0.0.1:15432:5432 postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
          for attempt in $(seq 1 30); do
            if docker exec "$INT01_PROJECT-regression" pg_isready -h 127.0.0.1 -U workflow -d file_storage; then break; fi
            sleep 1
          done
          docker exec "$INT01_PROJECT-regression" psql -U workflow -d file_storage -c 'CREATE DATABASE workflow_approval'
          mvn -B -f backend/pom.xml verify
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          reports = list(Path('backend/target/surefire-reports').glob('TEST-*.xml'))
          assert reports, 'Missing Java reports'
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          assert totals['tests'] and not any(totals[key] for key in ('failures', 'errors', 'skipped')), totals
          Path('.local/int01/java-regression.json').write_text(json.dumps(totals, indent=2))
          print('PASS all Java/PostgreSQL tests without skips:', totals)
          PY
      - name: G2 current AI-02 AI-03 and HTTP source and installed-wheel regression
        run: |
          python -m pip install -r intelligence/requirements.lock
          python -m pip check
          python -m pytest intelligence/tests -q -m "not dense_model" --junitxml=.local/int01/python-source.xml
          python -m build --no-isolation --outdir .local/int01/dist intelligence
          python scripts/intelligence/install-built-wheel.py --dist .local/int01/dist
          python -I scripts/intelligence/verify-installed-package.py
          python -I -m pytest -c scripts/intelligence/installed-pytest.ini intelligence/tests -q -m "not dense_model" --junitxml=.local/int01/python-wheel.xml
      - name: G3 clean metadata-driven Python image and installed runtime
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "INTELLIGENCE_TRIAGE_TOKEN=$token" >> "$GITHUB_ENV"
          docker build --no-cache --label "org.opencontainers.image.revision=$INT01_SOURCE_SHA" -f intelligence/Dockerfile -t "$INT01_PROJECT-intelligence:ci" .
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --entrypoint python -v "$PWD/scripts/intelligence/verify-installed-package.py:/verify.py:ro" -v "$HDPI_PROFILE_ROOT:/profiles:ro" -e HDPI_PROFILE_ROOT=/profiles "$INT01_PROJECT-intelligence:ci" -I /verify.py
          docker run --rm --entrypoint python "$INT01_PROJECT-intelligence:ci" -c "from importlib.metadata import version; import tomllib; print(version('smart-service-intelligence'))" > .local/int01/image-package-version.txt
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          import tomllib
          expected = tomllib.loads(Path('intelligence/pyproject.toml').read_text())['project']['version']
          assert Path('.local/int01/image-package-version.txt').read_text().strip() == expected
          tag = os.environ['INT01_PROJECT'] + '-intelligence:ci'
          image, = json.loads(subprocess.check_output(['docker', 'image', 'inspect', tag]))
          revision = image['Config']['Labels']['org.opencontainers.image.revision']
          assert revision == os.environ['INT01_SOURCE_SHA']
          Path('.local/int01/python-image.json').write_text(json.dumps(dict(tag=tag, id=image['Id'], revision=revision), indent=2))
          PY
      - name: G4 G5 G6 real current Java Python transport and failure boundaries
        run: |
          docker run -d --name "$INT01_PROJECT-python" --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m -e INTELLIGENCE_TRIAGE_TOKEN -e HDPI_PROFILE_ROOT=/profiles -e HDPI_REQUIRED_PROFILES=service-desk@0.3.0 -v "$HDPI_PROFILE_ROOT:/profiles:ro" -p 127.0.0.1:18000:8000 "$INT01_PROJECT-intelligence:ci"
          python - <<'PY'
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          for attempt in range(30):
              try:
                  urlopen(Request('http://127.0.0.1:18000/internal/intelligence/v1/triage', data=b'{}'), timeout=1)
              except HTTPError as error:
                  assert error.code == 401
                  break
              except (URLError, OSError):
                  time.sleep(1)
          else:
              raise SystemExit('Python startup failed')
          PY
          python scripts/intelligence/run-real-triage-e2e.py --java-root .
          docker rm -f "$INT01_PROJECT-python"
      - name: G7 prepare NEW disposable Keycloak gateway and application stack
        shell: pwsh
        run: |
          if (docker ps -aq --filter "label=com.docker.compose.project=$env:INT01_PROJECT") { throw 'Existing project refused' }
          if (docker volume ls -q --filter "label=com.docker.compose.project=$env:INT01_PROJECT") { throw 'Existing volumes refused' }
          ./scripts/setup.ps1
          docker compose -p $env:INT01_PROJECT -f compose.yaml -f compose.triage.yaml -f scripts/acceptance/integration-compose.yaml --profile intelligence up -d --build --wait --wait-timeout 300
          if ($LASTEXITCODE -ne 0) { throw 'Disposable stack startup failed' }
      - name: G7 real Keycloak APISIX role isolation and Python triage
        run: python -I scripts/acceptance/triage-gateway.py --project "$INT01_PROJECT" --output .local/int01/gateway-triage.json
      - name: G8 real Core authorized retrieval provenance and citation regression
        run: |
          python -I scripts/acceptance/intelligence-retrieval.py --output .local/int01/authorized-retrieval.json
          python -I scripts/intelligence/service-desk-evaluation.py --repo-root . --installed retrieval --fixtures-root fixtures/intelligence/service-desk --baseline fixtures/intelligence/service-desk/evaluation/baseline-v0.1.json --output .local/int01/retrieval-evaluation.json
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          images = []
          for suffix in ('platform', 'intelligence', 'gateway'):
              tag = os.environ['INT01_PROJECT'] + '-' + suffix + ':ci'
              image, = json.loads(subprocess.check_output(['docker', 'image', 'inspect', tag]))
              revision = image['Config']['Labels']['org.opencontainers.image.revision']
              assert revision == os.environ['INT01_SOURCE_SHA']
              images.append(dict(tag=tag, id=image['Id'], revision=revision))
          Path('.local/int01/images.json').write_text(json.dumps(images, indent=2))
          PY
      - name: G9 image inventory and vulnerability assessment (not release approval)
        shell: pwsh
        run: |
          ./scripts/scan-core.ps1 -Run "scan-$env:INT01_PROJECT" -CacheVolume "$env:INT01_PROJECT-trivy-cache" -Images @("$env:INT01_PROJECT-platform:ci", "$env:INT01_PROJECT-intelligence:ci", 'postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4', 'quay.io/keycloak/keycloak:26.0.8@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858', "$env:INT01_PROJECT-gateway:ci") -ReportOnly
      - name: Record exact tested commit and release gates
        if: always()
        run: python scripts/intelligence/summarize-integration.py
      - name: Upload non-secret integration evidence and full vulnerability inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-current-head-evidence
          include-hidden-files: true
          path: |
            .local/int01/source-commit.txt
            .local/int01/*summary.json
            .local/int01/java-regression.json
            .local/int01/gateway-triage.json
            .local/int01/authorized-retrieval.json
            .local/int01/retrieval-evaluation.json
            .local/int01/image-package-version.txt
            .local/int01/images.json
            .local/int01/python-image.json
            .local/int01/python-*.xml
            .local/ai04-e2e/summary.json
            .local/scan-int01-*/summary.json
            .local/scan-int01-*/scanner-version.txt
            .local/scan-int01-*/image-*.json
      - name: Stop ONLY this run's disposable containers
        if: always()
        run: |
          docker rm -f "$INT01_PROJECT-python" 2>/dev/null || test -z "$(docker ps -aq --filter name=^/$INT01_PROJECT-python$)"
          docker rm -f "$INT01_PROJECT-regression" 2>/dev/null || test -z "$(docker ps -aq --filter name=^/$INT01_PROJECT-regression$)"
          if test -n "$(docker ps -aq --filter label=com.docker.compose.project=$INT01_PROJECT)"; then
            docker compose -p "$INT01_PROJECT" -f compose.yaml -f compose.triage.yaml -f scripts/acceptance/integration-compose.yaml --profile intelligence stop
          fi
