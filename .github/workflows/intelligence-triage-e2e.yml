name: Intelligence triage real Java Python E2E
on:
  pull_request:
    branches: [develop]
    paths: ['intelligence/**', 'scripts/intelligence/**', 'compose.triage.yaml', '.github/workflows/intelligence-triage-e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ai03-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: intelligence/.python-version
      - name: Combine exact AI-03 and AI-04 revisions only in disposable worktree
        run: |
          ai04=$(git rev-parse HEAD)
          git worktree add --detach .local/ai03 c16598dd032b962b79a9100c80c61b79419c4749
          git -C .local/ai03 -c user.name=CI -c user.email=ci@example.invalid merge --no-commit --no-ff "$ai04"
          git -C .local/ai03 diff --check HEAD
      - name: Combined AI-02, AI-03 retrieval and HTTP regression
        run: |
          python -m pip install -r .local/ai03/intelligence/requirements.lock
          cd .local/ai03
          python -m pytest intelligence/tests -q
  real-java-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: isolated-ai04-ci-only
          POSTGRES_DB: file_storage
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      FILE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/file_storage
      FILE_TEST_DB_PASSWORD: isolated-ai04-ci-only
      INTELLIGENCE_TRIAGE_BASE_URL: http://127.0.0.1:18000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: intelligence/.python-version
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Disposable exact PR 20 worktree
        run: git worktree add --detach .local/be01 0050da1f4b840bde53b8b68f6e4dd74da50f960c
      - name: Build clean Python image and generate ephemeral service credential
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "INTELLIGENCE_TRIAGE_TOKEN=$token" >> "$GITHUB_ENV"
          docker build -f intelligence/Dockerfile -t ai04-intelligence:ci .
      - name: Start private Python service (loopback port only for CI)
        run: |
          docker run -d --name ai04-intelligence --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m -e INTELLIGENCE_TRIAGE_TOKEN -p 127.0.0.1:18000:8000 ai04-intelligence:ci
          python - <<'PY'
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          for attempt in range(30):
              try:
                  urlopen(Request('http://127.0.0.1:18000/internal/intelligence/v1/triage', data=b'{}'), timeout=1)
              except HTTPError as error:
                  assert error.code == 401
                  break
              except (URLError, OSError):
                  time.sleep(1)
          else:
              raise SystemExit('Python startup failed')
          PY
      - name: Real SUCCESS, real service auth rejection, unavailable and fault-injected boundaries
        run: python scripts/intelligence/run-real-triage-e2e.py --java-root .local/be01
      - name: Upload non-secret E2E summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai04-real-triage-summary
          include-hidden-files: true
          path: .local/ai04-e2e/summary.json
      - name: Stop only the disposable Python container
        if: always()
        run: docker rm -f ai04-intelligence || true
