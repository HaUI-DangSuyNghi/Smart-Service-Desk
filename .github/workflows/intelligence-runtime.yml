name: Intelligence runtime
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    paths:
      - 'intelligence/**'
      - 'contracts/intelligence/**'
      - 'contracts/apps/servicedesk/intelligence/**'
      - 'fixtures/intelligence/**'
      - 'scripts/intelligence/**'
      - 'scripts/check-tier-boundaries.py'
      - 'scripts/test-tier-boundaries.py'
      - 'scripts/acceptance/intelligence-*'
      - 'backend/src/main/java/vn/haui/dx/core/**'
      - 'backend/src/main/resources/**'
      - 'infra/**'
      - 'compose.yaml'
      - 'compose.triage.yaml'
      - '.gitattributes'
      - '.github/workflows/intelligence-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    env:
      HDPI_PROFILE_ROOT: ${{ github.workspace }}/intelligence/src/apps/servicedesk/intelligence/profiles
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: intelligence/.python-version
      - name: Install pinned runtime and build tools
        run: python -m pip install -r intelligence/requirements.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Foundation and immutable executable profiles
        env:
          INTELLIGENCE_PROFILE_BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python scripts/intelligence/validate-foundation.py
      - name: Strict evaluation ownership
        run: python scripts/check-tier-boundaries.py
      - name: Boundary mutation proofs
        run: python scripts/test-tier-boundaries.py
      - name: Unit, contract, conformance and regression tests
        id: source-tests
        run: python -m pytest intelligence/tests -q --junitxml=.local/ai04/source-tests.xml
      - name: Source evaluation and executable quality security provenance gates
        if: ${{ !cancelled() && steps.source-tests.outcome != 'skipped' }}
        run: >-
          python scripts/intelligence/run-evaluation.py
          --dataset fixtures/intelligence/service-desk
          --baseline fixtures/intelligence/service-desk/evaluation/baseline-v0.1.json
          --checks fixtures/intelligence/service-desk/evaluation/security-checks.json
          --conformance-config fixtures/intelligence/service-desk/evaluation/conformance-config.json
          --junit .local/ai04/source-tests.xml --output .local/ai04/source
      - name: Source knowledge enrichment controls
        run: python scripts/intelligence/knowledge-data.py compare --output .local/ai045/source
      - name: Build source distribution and wheel without new resolution
        run: python -m build --no-isolation --outdir .local/ai04-dist intelligence
      - name: Install built wheel
        run: python scripts/intelligence/install-built-wheel.py --dist .local/ai04-dist
      - name: Verify installed package without source imports
        run: python -I scripts/intelligence/verify-installed-package.py
      - name: Run regression and security suite against installed wheel
        id: wheel-tests
        run: python -I -m pytest -c scripts/intelligence/installed-pytest.ini intelligence/tests -q --junitxml=.local/ai04/wheel-tests.xml
      - name: Evaluate shipped wheel with executable gates
        if: ${{ !cancelled() && steps.wheel-tests.outcome != 'skipped' }}
        run: >-
          python -I scripts/intelligence/run-evaluation.py --installed
          --dataset fixtures/intelligence/service-desk
          --baseline fixtures/intelligence/service-desk/evaluation/baseline-v0.1.json
          --checks fixtures/intelligence/service-desk/evaluation/security-checks.json
          --conformance-config fixtures/intelligence/service-desk/evaluation/conformance-config.json
          --junit .local/ai04/wheel-tests.xml --output .local/ai04/wheel
      - name: Require source and installed wheel evidence to agree
        run: python -I scripts/intelligence/verify-evaluation-equivalence.py .local/ai04/source .local/ai04/wheel
      - name: Installed wheel knowledge enrichment controls
        run: python -I scripts/intelligence/knowledge-data.py --installed compare --output .local/ai045/wheel
      - name: Require knowledge source and wheel evidence to agree
        run: python -I scripts/intelligence/verify-knowledge-evidence.py .local/ai045/source .local/ai045/wheel
      - name: Retain safe knowledge experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai045-corpus-${{ matrix.os }}
          path: |
            .local/ai045/source/*.json
            .local/ai045/wheel/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain safe authored evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai04-evaluation-${{ matrix.os }}
          path: |
            .local/ai04/source/*.json
            .local/ai04/wheel/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify diff whitespace
        env:
          INTELLIGENCE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: python scripts/intelligence/verify-pr-range.py
  knowledge-data-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: intelligence/.python-version
      - name: Install locked tools
        run: python -m pip install -r intelligence/requirements.lock
      - name: Validate schema integrity safety and draft annotation boundaries
        run: python scripts/intelligence/knowledge-data.py validate --output .local/ai045/data-quality.json
      - name: Build deterministic draft projection
        run: python scripts/intelligence/knowledge-data.py project --draft --output .local/ai045/projection
      - name: Analyze responsibilities vocabulary and DEV phrase overlap
        run: python scripts/intelligence/knowledge-data.py analyze --output .local/ai045/corpus-quality.json
      - name: Reproduce corpus-only evidence
        run: python scripts/intelligence/knowledge-data.py compare --output .local/ai045/paragraph
      - name: Verify frozen corpus controls
        run: python scripts/intelligence/verify-knowledge-evidence.py .local/ai045/paragraph fixtures/intelligence/service-desk/evaluation/corpus-experiments/paragraph-v0.2
      - name: Reproduce separate section experiment
        run: python scripts/intelligence/knowledge-data.py chunk-experiment --output .local/ai045/section
      - name: Verify section rejection remains explicit
        run: python scripts/intelligence/verify-knowledge-evidence.py --section .local/ai045/section fixtures/intelligence/service-desk/evaluation/corpus-experiments/section-v0.2
      - name: Retain safe data-quality summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai045-data-quality
          path: |
            .local/ai045/data-quality.json
            .local/ai045/corpus-quality.json
            .local/ai045/section/chunk-comparison.json
          include-hidden-files: true
          retention-days: 7
  evaluation-equivalence:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download evaluation evidence from both operating systems
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name ai04-evaluation-ubuntu-24.04 --dir .local/ai04-linux
          gh run download "$RUN_ID" --name ai04-evaluation-windows-2022 --dir .local/ai04-windows
          gh run download "$RUN_ID" --name ai045-corpus-ubuntu-24.04 --dir .local/ai045-linux
          gh run download "$RUN_ID" --name ai045-corpus-windows-2022 --dir .local/ai045-windows
      - name: Require equivalent rankings metrics gates and fingerprints
        run: python3 -I scripts/intelligence/verify-evaluation-equivalence.py .local/ai04-linux/wheel .local/ai04-windows/wheel
      - name: Require equivalent knowledge enrichment evidence
        run: python3 -I scripts/intelligence/verify-knowledge-evidence.py .local/ai045-linux/wheel .local/ai045-windows/wheel
  core-integration:
    env:
      HDPI_PROFILE_ROOT: ${{ github.workspace }}/intelligence/src/apps/servicedesk/intelligence/profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: intelligence/.python-version
      - name: Install locked tools and build isolated wheel
        run: |
          python -m pip install -r intelligence/requirements.lock
          python -m build --no-isolation --outdir .local/ai03-integration-dist intelligence
          python scripts/intelligence/install-built-wheel.py --dist .local/ai03-integration-dist
      - name: Prepare disposable local identity configuration
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Start isolated real Core and identity services
        run: docker compose -p dx-ai03-hardening -f compose.yaml -f scripts/acceptance/intelligence-compose.yaml up -d --build --wait --wait-timeout 300
      - name: Verify authenticated Core retrieval and negative authorization paths
        run: python -I scripts/acceptance/intelligence-retrieval.py --output .local/ai03-core-acceptance.json
      - name: Retain safe synthetic acceptance summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai03-core-acceptance-summary
          path: .local/ai03-core-acceptance.json
          include-hidden-files: true
          retention-days: 7
      - name: Stop isolated acceptance services
        if: always()
        run: docker compose -p dx-ai03-hardening -f compose.yaml -f scripts/acceptance/intelligence-compose.yaml stop
