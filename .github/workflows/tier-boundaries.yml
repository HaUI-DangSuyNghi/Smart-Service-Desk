name: Tier boundaries
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce exact debt and expiry
        run: python3 scripts/check-tier-boundaries.py
      - name: Prove guards reject boundary mutations
        run: python3 scripts/test-tier-boundaries.py
  architecture-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Enforce compiled Java dependency edges
        run: mvn -B -f backend/pom.xml -Dtest=TierBoundaryTest test
  isolated-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        profile: [core-only, second-domain]
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: isolated-boundary-ci
          POSTGRES_DB: file_storage
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      FILE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/file_storage
      FILE_TEST_DB_PASSWORD: isolated-boundary-ci
      WORKFLOW_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/workflow_approval
      WORKFLOW_TEST_DB_PASSWORD: isolated-boundary-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Create isolated workflow database
        env:
          PGPASSWORD: isolated-boundary-ci
        run: psql -h localhost -U workflow -d file_storage -c 'CREATE DATABASE workflow_approval'
      - name: Core without upper tiers
        if: matrix.profile == 'core-only'
        run: mvn -B -f backend/pom.xml -Pcore-only clean verify
      - name: Second application without Service Desk
        if: matrix.profile == 'second-domain'
        run: mvn -B -f backend/pom.xml -Psecond-domain -Dtest=RoomRequestIntegrationTest,TierBoundaryTest,CoreKnowledgeCatalogTest,CoreProcessCapabilitiesTest,WorkspaceActivityJournalTest,TrustedIntelligenceCapabilityTest clean verify
      - name: Reject skipped or failed proof tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('backend/target/surefire-reports').glob('TEST-*.xml'))
          assert reports, 'Missing proof reports'
          for path in reports:
              suite = ET.parse(path).getroot()
              assert all(int(suite.get(key, 0)) == 0 for key in ('failures', 'errors', 'skipped')), path
          PY
  second-domain-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: isolated-boundary-ci
          POSTGRES_DB: file_storage
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      FILE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/file_storage
      FILE_TEST_DB_PASSWORD: isolated-boundary-ci
      HDPI_PROFILE_ROOT: ${{ github.workspace }}/apps/roomrequest/intelligence/profiles
      HDPI_REQUIRED_PROFILES: room-request@0.2.0
      INTELLIGENCE_TRIAGE_BASE_URL: http://127.0.0.1:19091
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: intelligence/.python-version
      - name: Install the unchanged generic wheel
        run: |
          python -m pip install -r intelligence/requirements.lock
          python -m build --no-isolation --outdir .local/reuse-dist intelligence
          python scripts/intelligence/install-built-wheel.py --dist .local/reuse-dist
      - name: Start private runtime with only the second application's profile
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "INTELLIGENCE_TRIAGE_TOKEN=$token" >> "$GITHUB_ENV"
          INTELLIGENCE_TRIAGE_TOKEN="$token" python -I -m hdpi.http_service --port 19091 > .local/reuse-python.log 2>&1 &
          echo $! > .local/reuse-python.pid
          python - <<'PY'
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          for attempt in range(30):
              try:
                  urlopen(Request('http://127.0.0.1:19091/internal/intelligence/v1/triage', data=b'{}'), timeout=1)
              except HTTPError as error:
                  assert error.code == 401
                  break
              except (URLError, OSError):
                  time.sleep(1)
          else:
              raise SystemExit('Private runtime failed to start')
          PY
      - name: Prove real second-domain Java to Python reuse
        run: mvn -B -f backend/pom.xml -Psecond-domain -Dtest=RoomRequestPythonE2E clean test
      - name: Stop test runtime
        if: always()
        run: if test -f .local/reuse-python.pid; then kill "$(cat .local/reuse-python.pid)"; fi
