name: Tier boundaries
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, feature/ai07-ticket-intelligence, feature/ai07-qwen-lora-provider]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce exact debt and expiry
        run: python3 scripts/check-tier-boundaries.py
      - name: Prove guards reject boundary mutations
        run: python3 scripts/test-tier-boundaries.py
  architecture-frontend:
    runs-on: ubuntu-24.04
    container: node:24.12.0-bookworm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install locked frontend tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify strict types, import direction and application clients
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run build:platform
      - name: Install pinned Chromium for browser contract controls
        run: npx playwright install --with-deps chromium
      - name: Verify assistance UX with stub public API (not gateway acceptance)
        run: npm run test:e2e
  architecture-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Enforce compiled Java dependency edges
        run: mvn -B -f backend/pom.xml -Dtest=TierBoundaryTest test
  isolated-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        profile: [core-only, second-domain]
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: isolated-boundary-ci
          POSTGRES_DB: file_storage
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      FILE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/file_storage
      FILE_TEST_DB_PASSWORD: isolated-boundary-ci
      WORKFLOW_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/workflow_approval
      WORKFLOW_TEST_DB_PASSWORD: isolated-boundary-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Create isolated workflow database
        env:
          PGPASSWORD: isolated-boundary-ci
        run: psql -h localhost -U workflow -d file_storage -c 'CREATE DATABASE workflow_approval'
      - name: Core without upper tiers, including real fresh-admin Keycloak checks
        if: matrix.profile == 'core-only'
        shell: pwsh
        run: ./scripts/test-fresh-admin.ps1 -Profile core-only
      - name: Second application without Service Desk
        if: matrix.profile == 'second-domain'
        run: mvn -B -f backend/pom.xml -Psecond-domain -Dtest=RoomRequestIntegrationTest,TierBoundaryTest,CoreKnowledgeCatalogTest,CoreProcessCapabilitiesTest,WorkspaceActivityJournalTest,TrustedIntelligenceCapabilityTest,HttpClassificationTransportTest clean verify
      - name: Reject skipped or failed proof tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('backend/target/surefire-reports').glob('TEST-*.xml'))
          assert reports, 'Missing proof reports'
          for path in reports:
              suite = ET.parse(path).getroot()
              assert all(int(suite.get(key, 0)) == 0 for key in ('failures', 'errors', 'skipped')), path
          PY
  second-domain-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: isolated-boundary-ci
          POSTGRES_DB: file_storage
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      FILE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/file_storage
      FILE_TEST_DB_PASSWORD: isolated-boundary-ci
      HDPI_PROFILE_ROOT: ${{ github.workspace }}/intelligence/src/apps/roomrequest/intelligence/profiles
      HDPI_REQUIRED_PROFILES: room-request@0.3.0
      INTELLIGENCE_TRIAGE_BASE_URL: http://127.0.0.1:19091
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: intelligence/.python-version
      - name: Install the unchanged generic wheel
        run: |
          python -m pip install -r intelligence/requirements.lock
          python -m build --no-isolation --outdir .local/reuse-dist intelligence
          python scripts/intelligence/install-built-wheel.py --dist .local/reuse-dist
      - name: Preflight isolated Room Request profile from the installed wheel
        run: |
          python -I - <<'PY'
          from hdpi.profiles.registry import ProfileRegistry
          try:
              profile = ProfileRegistry().get('room-request', '0.3.0')
              assert profile.identity == 'room-request@0.3.0'
          except Exception as error:
              print('PROFILE_PREFLIGHT_FAILED exception=' + type(error).__name__[:64])
              raise SystemExit(1) from None
          print('PASS isolated active profile load')
          PY
      - name: Start private runtime with only the second application's profile
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "INTELLIGENCE_TRIAGE_TOKEN=$token" >> "$GITHUB_ENV"
          INTELLIGENCE_TRIAGE_TOKEN="$token" python -I -m hdpi.http_service --port 19091 > .local/reuse-python.log 2>&1 &
          echo $! > .local/reuse-python.pid
          python - <<'PY'
          import re
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          for attempt in range(30):
              try:
                  urlopen(Request('http://127.0.0.1:19091/internal/intelligence/v1/triage', data=b'{}'), timeout=1)
              except HTTPError as error:
                  assert error.code == 401
                  break
              except (URLError, OSError):
                  time.sleep(1)
          else:
              # Only emit the runtime's fixed diagnostic codes, never raw stderr.
              log = Path('.local/reuse-python.log').read_bytes()[-4096:].decode('utf-8', errors='replace')
              for code in re.findall(r'^Intelligence service configuration failed \[(PROFILE_INVALID|ENGINE_CONFIGURATION|INVALID_CONFIGURATION|OS_ERROR|INTERNAL_ERROR)\]$', log, re.MULTILINE)[-1:]:
                  print('PRIVATE_RUNTIME_STARTUP_FAILED code=' + code)
              raise SystemExit('Private runtime failed to start')
          PY
      - name: Prove real second-domain Java to Python reuse
        run: mvn -B -f backend/pom.xml -Psecond-domain -Dtest=RoomRequestPythonE2E clean test
      - name: Stop test runtime
        if: always()
        run: |
          if test -f .local/reuse-python.pid; then
            pid="$(cat .local/reuse-python.pid)"
            if kill -0 "$pid" 2>/dev/null; then kill "$pid" 2>/dev/null || true; fi
          fi
  real-three-tier-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: intelligence/.python-version
      - name: Install contract validators separately from the generic runtime
        run: |
          python -m venv .local/tier-contracts
          .local/tier-contracts/bin/python -m pip install -r scripts/acceptance/requirements.txt
      - name: Exercise real H-P-D-I and the private Python runtime
        shell: pwsh
        run: ./scripts/test-tier-reuse.ps1 -Python .local/tier-contracts/bin/python -Project dx-tier-reuse-ci-${{ github.run_id }}
      - name: Retain synthetic reuse summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: three-tier-reuse-summary
          path: .local/dx-tier-reuse-ci-${{ github.run_id }}.json
          include-hidden-files: true
          retention-days: 7
