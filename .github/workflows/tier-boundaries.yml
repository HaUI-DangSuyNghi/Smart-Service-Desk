name: Tier boundaries
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/check-tier-boundaries.py
      - run: python3 scripts/test-tier-boundaries.py
  architecture-java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and run architecture rules
        run: docker build --target build -t dx-core-build:0.1.0 backend
  architecture-frontend:
    runs-on: ubuntu-24.04
    container: node:24.12.0-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install locked frontend tooling
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce imports and verify extensions
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run build:platform
  tier-isolation-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        proof: [core-only, second-domain]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare Maven test environment
        run: docker build --target build -t dx-core-build:0.1.0 backend
      - name: Core without upper tiers
        if: matrix.proof == 'core-only'
        shell: pwsh
        run: ./scripts/test-file.ps1 -MavenProfile core-only
      - name: HPDI and second domain without Service Desk
        if: matrix.proof == 'second-domain'
        shell: pwsh
        run: ./scripts/test-file.ps1 -MavenProfile second-domain -Tests 'RoomRequestIntegrationTest,TierBoundaryTest,CoreProcessCapabilitiesTest,CoreKnowledgeCatalogTest,TrustedIntelligenceCapabilityTest,WorkspaceActivityJournalTest'
  real-three-tier-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install contract validators
        run: |
          python3 -m venv .local/tier-contracts
          .local/tier-contracts/bin/pip install -r scripts/acceptance/requirements.txt
      - name: Exercise real H-P-D-I and private Python runtime
        shell: pwsh
        run: ./scripts/test-tier-reuse.ps1 -Python .local/tier-contracts/bin/python
      - name: Retain synthetic summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: three-tier-reuse-summary
          path: .local/tier-reuse-acceptance.json
          include-hidden-files: true
          retention-days: 7
