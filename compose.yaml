name: dx-core
services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U core -d core"]
      interval: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: core
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Run scripts/setup.ps1}
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: 'true'
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["./.local/dx-lab-realm.json:/opt/keycloak/data/import/dx-lab-realm.json:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
  core:
    image: dx-core:0.1.0
    build: ./backend
    environment:
      DX_INTELLIGENCE_URL: ${DX_INTELLIGENCE_URL:-}
      DX_INTELLIGENCE_SERVICE_TOKEN: ${DX_INTELLIGENCE_SERVICE_TOKEN:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1}
      DATABASE_URL: jdbc:postgresql://postgres:5432/core
      DX_STORAGE_ROOT: /var/lib/dx/files
      DX_ALLOW_UNSCANNED_UPLOAD: 'true'
      JWT_JWKS: http://keycloak:8080/realms/dx-lab/protocol/openid-connect/certs
    volumes: ["files:/var/lib/dx/files"]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  intelligence:
    profiles: [intelligence]
    build:
      context: .
      dockerfile: intelligence/Dockerfile
    environment:
      HDPI_SERVICE_TOKEN: ${DX_INTELLIGENCE_SERVICE_TOKEN:-}
    volumes:
      - ./apps/servicedesk/intelligence/profiles:/profiles:ro
    read_only: true
    tmpfs: [/tmp]
  gateway:
    image: apache/apisix:3.11.0-debian
    ports: ["127.0.0.1:9080:9080"]
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      core: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/localhost/9080; printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  files:
