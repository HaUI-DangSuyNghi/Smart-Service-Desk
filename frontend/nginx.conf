# Phục vụ bản build của frontend trong Docker, thay cho `npm run dev`.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Gọi API cùng origin như proxy Vite: trình duyệt → nginx → APISIX, không cần CORS
    location /api/ {
        proxy_pass http://gateway:9080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # File tối đa 5 MB (Core); mặc định nginx chỉ cho 1 MB
        client_max_body_size 6m;
    }

    # WebSocket realtime: nâng cấp kết nối, giữ lâu (heartbeat STOMP 10 giây)
    location = /ws {
        proxy_pass http://gateway:9080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # File trong assets/ có hash trong tên nên cache lâu được
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ứng dụng một trang: mọi đường dẫn khác (/inbox, /auth/callback...) trả index.html để router xử lý
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
