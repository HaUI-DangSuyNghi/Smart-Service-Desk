status: PROPOSED
profile: service-desk
taxonomy_version: 0.1.0
profile_version: service-desk@0.1.0
rules_version: 0.1.0
priority_policy_version: priority-policy@0.1.0
priority_policy_owner: Service Desk / Process Owner
categories:
  NETWORK:
    definition: Sự cố Wi-Fi, LAN, Internet, IP, DNS hoặc access point.
    positive_signals: [wifi, wi-fi, mạng, internet, không vào mạng, mất mạng, chập chờn, dns, ip, access point, lan]
    exclusions: [Tài khoản bị khóa hoặc sai mật khẩu, Chỉ một ứng dụng lỗi khi Internet bình thường, Thiết bị vật lý không bật]
    suggested_group: IT-NETWORK
    rule_id: CAT-NET-001
  ACCOUNT:
    definition: Sự cố đăng nhập, mật khẩu, khóa tài khoản, xác thực hoặc quyền user.
    positive_signals: [đăng nhập, mật khẩu, password, tài khoản, account, bị khóa, không có quyền, permission, authentication]
    exclusions: [Đăng nhập được nhưng mất mạng, Ứng dụng crash sau đăng nhập, Máy không khởi động]
    suggested_group: IT-ACCOUNT
    rule_id: CAT-ACC-001
  SOFTWARE:
    definition: Lỗi ứng dụng, hệ điều hành, cài đặt, crash, cập nhật hoặc cấu hình phần mềm.
    positive_signals: [ứng dụng, phần mềm, software, windows, linux, crash, không mở được, cài đặt, update, version]
    exclusions: [Mất nguồn hoặc hư hỏng vật lý rõ ràng, Lỗi chỉ do account bị khóa, Nhiều dịch vụ không truy cập do mất mạng]
    suggested_group: IT-SOFTWARE
    rule_id: CAT-SW-001
  HARDWARE:
    definition: Sự cố nguồn, màn hình, bàn phím, chuột, ổ đĩa, RAM hoặc thiết bị ngoại vi vật lý.
    positive_signals: [không lên nguồn, không bật, màn hình, bàn phím, chuột, ổ cứng, ram, nguồn, hỏng, cháy, vỡ]
    exclusions: [Chỉ một ứng dụng crash khi OS hoạt động, Chỉ lỗi đăng nhập, Mô tả máy không dùng được chưa có dấu hiệu vật lý]
    suggested_group: IT-HARDWARE
    rule_id: CAT-HW-001
  OTHER:
    definition: Sự cố hợp lệ ngoài taxonomy CNTT, như điều hòa, chiếu sáng, bàn ghế.
    positive_signals: [điều hòa, chiếu sáng, bàn ghế, cơ sở vật chất]
    exclusions: [Root cause NETWORK ACCOUNT SOFTWARE HARDWARE đã rõ]
    suggested_group: GENERAL-SUPPORT
    rule_id: CAT-OTHER-001
conflict_policy:
  rule_id: CONFLICT-ROOT-001
  principle: Root cause có evidence rõ ưu tiên hơn symptom; không dùng thứ tự category để đoán.
  ambiguous:
    rule_id: REVIEW-INSUFFICIENT-001
    category: OTHER
    priority: MEDIUM
    suggested_group: GENERAL-SUPPORT
    impact: null
    urgency: null
    needs_review: true
    reason_code: INSUFFICIENT_INFORMATION
impact_rules:
  I1: IMPACT-USER-001
  I2: IMPACT-GROUP-001
  I3: IMPACT-ROOM-001
  I4: IMPACT-WIDE-001
urgency_rules:
  U1: URGENCY-WORKAROUND-001
  U2: URGENCY-DEFERRED-001
  U3: URGENCY-BLOCKING-001
  U4: URGENCY-CRITICAL-001
priority_rules:
  LOW: PRI-001
  MEDIUM: PRI-002
  HIGH: PRI-003
  CRITICAL: PRI-004
priority_matrix:
  I1: {U1: LOW, U2: LOW, U3: MEDIUM, U4: HIGH}
  I2: {U1: LOW, U2: MEDIUM, U3: HIGH, U4: HIGH}
  I3: {U1: MEDIUM, U2: HIGH, U3: HIGH, U4: CRITICAL}
  I4: {U1: HIGH, U2: HIGH, U3: CRITICAL, U4: CRITICAL}
