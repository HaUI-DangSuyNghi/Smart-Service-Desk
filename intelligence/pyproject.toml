[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-service-intelligence"
version = "0.2.0"
description = "Deterministic, profile-driven triage library for Smart Service Desk"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.2", "jsonschema==4.23.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "build==1.2.2.post1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.setuptools]
include-package-data = true
