          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/people:
    parameters:
    - *id001
    get:
      description: Tên hiển thị của các subject người gọi đã thấy (người tạo, người xử lý); mọi thành viên workspace. Danh bạ lỗi → object rỗng.
      parameters:
