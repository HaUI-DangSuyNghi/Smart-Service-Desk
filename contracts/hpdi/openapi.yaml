openapi: 3.0.3
info:
  title: H-P-D-I shared capability API
  version: 0.1.0
  description: Tier-2 contracts; no engine or domain policy types. Java-only start/contribution/Intelligence
    contracts are documented beside this specification.
security:
- bearerAuth: []
paths:
  /api/hpdi/v1/workspaces/{workspace}/duty:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    get:
      operationId: listDuty
      description: Service Desk agents see their own duty; coordinators with task:assign see current workspace agents. Missing duty defaults to off. No schedules.
      responses:
        '200':
          description: Current agent duty states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DutyStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/duty/{subject}:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    - name: subject
      in: path
      required: true
      schema:
        type: string
      description: Own subject or me. Changing another agent is forbidden, including for coordinators.
    put:
      operationId: setDuty
      description: Agent with current membership and task:handle changes only their own persisted duty. Does not interrupt work. Audit and duty commit atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [onDuty]
              properties:
                onDuty:
                  type: boolean
                note:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        '200':
          description: Persisted duty status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/queue:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    get:
      operationId: getQueue
      description: Own agent queue; another assignee requires coordinator and task:assign. IN_PROGRESS first, native
        priority descending, due date then creation/id. Full-queue remaining load; no SLA/aging/shift projection.
      parameters:
      - name: assignee
        in: query
        required: false
        schema:
          type: string
        description: subject; bỏ trống = chính mình
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang hàng đợi đã sắp xếp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/start:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    post:
      operationId: startWork
      description: Reviewed work only. JWT, workspace and current permissions required. No SLA, aging, duty or predicted-start
        calculation.
      responses:
        '200':
          description: Việc sau khi bắt đầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/pause:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    post:
      operationId: pauseWork
      description: Reviewed work only. JWT, workspace and current permissions required. No SLA, aging, duty or predicted-start
        calculation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  $ref: '#/components/schemas/PendingReason'
                note:
                  type: string
                  maxLength: 1000
                  description: Bắt buộc khi reason = OTHER
      responses:
        '200':
          description: Việc sau khi tạm dừng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/resume:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    post:
      operationId: resumeWork
      description: Reviewed work only. JWT, workspace and current permissions required. No SLA, aging, duty or predicted-start
        calculation.
      responses:
        '200':
          description: Việc sau khi tiếp tục
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/hpdi/v1/workspaces/{workspace}/actor:
    parameters:
    - &id001
      $ref: '#/components/parameters/Workspace'
    get:
      responses:
        '200':
          description: Authorized capability projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hpdi/v1/workspaces/{workspace}/processes:
    parameters:
    - *id001
    get:
      description: Mọi quy trình đã đăng ký kèm nhãn hiển thị, kết quả hợp lệ theo bước và canStart của người gọi.
      responses:
        '200':
          description: Danh mục quy trình, sắp theo tên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessDescriptor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/processes/statistics:
    parameters:
    - *id001
    get:
      description: Số liệu dashboard (quyền dashboard:view). started/running/completed tính trên yêu cầu tạo trong [from, to); waitingClaim/inProgress là việc đang mở lúc gọi. Khoảng tối đa 366 ngày.
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: zone
        in: query
        description: Múi giờ IANA để chia số liệu theo ngày
        schema:
          type: string
          default: UTC
          example: Asia/Ho_Chi_Minh
      responses:
        '200':
          description: Số liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessStatistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/assign:
    parameters:
    - *id001
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Giao (lại) việc (quyền task:assign, Core yêu cầu coordinator). Chỉ giao cho người thuộc nhóm xử lý của bước, không giao cho người tạo yêu cầu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - assignee
              properties:
                assignee:
                  type: string
                  description: subject người được giao
      responses:
        '200':
          description: Việc sau khi giao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/processes/{processKey}/instances:
    parameters:
    - *id001
    - name: processKey
      in: path
      required: true
      schema:
        type: string
    post:
      description: Tạo yêu cầu từ form chung. Chỉ quy trình tự phục vụ (canStart); businessKey do server sinh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                variables:
                  type: object
                  description: Chỉ các key trong startFields; ô một dòng ≤ 200 ký tự, ô multiline ≤ 2000
                  additionalProperties:
                    type: string
                    maxLength: 2000
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessHandle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hpdi/v1/workspaces/{workspace}/instances:
    parameters:
    - *id001
    get:
      description: Yêu cầu, mới nhất trước. scope=mine (mặc định, cần request:create) là yêu cầu người gọi đã tạo; scope=all (cần request:view-all) là mọi yêu cầu người gọi được xem với tư cách reader.
      parameters:
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - mine
          - all
          default: mine
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/inbox:
    parameters:
    - *id001
    get:
      responses:
        '200':
          description: Authorized capability projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - ASSIGNED
          - CANDIDATE
          - ALL
          default: CANDIDATE
        description: ASSIGNED/CANDIDATE cần quyền task:handle; ALL (mọi việc đang mở, để giao việc) cần task:assign
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
  /api/hpdi/v1/workspaces/{workspace}/instances/{id}/timeline:
    parameters:
    - *id001
    - &id002
      name: id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Authorized capability projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTimeline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/claim:
    parameters:
    - *id001
    - *id002
    post:
      responses:
        '200':
          description: Authorized capability projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/complete:
    parameters:
    - *id001
    - *id002
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expectedTaskKey
              - outcome
              properties:
                expectedTaskKey:
                  type: string
                outcome:
                  type: string
                comment:
                  type: string
      responses:
        '204':
          description: Completed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/hpdi/v1/workspaces:
    get:
      description: Workspace của người gọi (theo token) kèm tên hiển thị và vai trò, cho ô chọn workspace.
      responses:
        '200':
          description: Workspace của người gọi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/hpdi/v1/workspaces/{workspace}/members:
    parameters:
    - *id001
    get:
      description: Thành viên workspace (danh bạ từ Keycloak); chỉ thành viên workspace được xem. Chỉ để hiển thị, không cấp quyền.
      responses:
        '200':
          description: Thành viên, sắp theo username
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/people:
    parameters:
    - *id001
    get:
      description: Tên hiển thị của các subject người gọi đã thấy (người tạo, người xử lý); mọi thành viên workspace. Danh bạ lỗi → object rỗng.
      parameters:
      - name: ids
        in: query
        required: true
        style: form
        explode: false
        schema:
          type: array
          maxItems: 100
          items:
            type: string
      responses:
        '200':
          description: subject → tên
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/audit:
    parameters:
    - *id001
    get:
      description: Nhật ký của cả workspace (quyền audit:view; Core yêu cầu coordinator hoặc platform-admin), mới nhất trước.
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: action
        in: query
        schema:
          type: string
      - name: actor
        in: query
        description: subject người thực hiện
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang nhật ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/permissions:
    parameters:
    - *id001
    get:
      description: Quyền của người gọi trong workspace – gộp quyền (role của client dx-permissions trong Keycloak) của các vai trò người gọi có; vai trò lấy từ token. Chỉ để hiển thị.
      responses:
        '200':
          description: Quyền, sắp theo tên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspacePermission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/activity:
    parameters:
    - *id001
    get:
      description: Hoạt động của tôi – thao tác do chính người gọi làm trong workspace (lấy từ audit), mới nhất trước. Mọi thành viên workspace được xem; người thực hiện luôn lấy từ token.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/knowledge:
    parameters:
    - *id001
    get:
      description: Knowledge Hub – tài liệu văn bản (text/plain, text/markdown) của workspace, mới nhất trước.
      parameters:
      - name: q
        in: query
        description: Tìm theo tiêu đề, không phân biệt hoa thường
        schema:
          type: string
          maxLength: 200
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang tài liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/knowledge/{id}:
    parameters:
    - *id001
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      responses:
        '200':
          description: Authorized capability projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedKnowledge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hpdi/v1/workspaces/{workspace}/knowledge/{id}/record:
    parameters:
    - *id001
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      description: Provenance của một tài liệu cho trang chi tiết (quyền document:view).
      responses:
        '200':
          description: Provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    DutyStatus:
      type: object
      additionalProperties: false
      required: [subject, onDuty, note, updatedAt]
      properties:
        subject:
          type: string
        onDuty:
          type: boolean
        note:
          type: string
          nullable: true
          maxLength: 500
        updatedAt:
          type: string
          format: date-time
          nullable: true
    Priority:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    WorkState:
      type: string
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - PENDING
    PendingReason:
      type: string
      enum:
      - WAITING_REQUESTER
      - WAITING_PARTS
      - WAITING_EXTERNAL
      - OTHER
    Estimate:
      type: object
      additionalProperties: false
      required:
      - minutes
      - basis
      properties:
        minutes:
          type: integer
          minimum: 1
          maximum: 10080
        basis:
          type: string
          enum:
          - DEFAULT
          - COORDINATOR
    QueueItem:
      allOf:
      - $ref: '#/components/schemas/WorkItem'
      - type: object
        required:
        - label
        - workState
        - priority
        - basePriority
        - estimate
        - workedMinutes
        - remainingMinutes
        - reopenCount
        properties:
          label:
            type: string
            maxLength: 200
          workState:
            $ref: '#/components/schemas/WorkState'
          priority:
            $ref: '#/components/schemas/Priority'
          basePriority:
            $ref: '#/components/schemas/Priority'
          estimate:
            $ref: '#/components/schemas/Estimate'
          workedMinutes:
            type: integer
            minimum: 0
          remainingMinutes:
            type: integer
            minimum: 0
          reopenCount:
            type: integer
            minimum: 0
          pendingReason:
            type: string
            nullable: true
            enum: [WAITING_REQUESTER, WAITING_PARTS, WAITING_EXTERNAL, OTHER, null]
          pendingNote:
            type: string
            nullable: true
    QueuePage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        - assignee
        - loadMinutes
        properties:
          assignee:
            type: string
          loadMinutes:
            type: integer
            minimum: 0
          items:
            type: array
            items:
              $ref: '#/components/schemas/QueueItem'
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - requestId
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Forbidden
        status:
          type: integer
          example: 403
        detail:
          type: string
          example: Workspace access denied
        instance:
          type: string
        code:
          type: string
          enum:
          - VALIDATION_FAILED
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - PAYLOAD_TOO_LARGE
          - UNSUPPORTED_MEDIA_TYPE
          - SERVICE_UNAVAILABLE
        requestId:
          type: string
          description: Trùng header X-Request-ID
    ProcessTimeline:
      type: object
      required:
      - id
      - processKey
      - businessKey
      - workspace
      - initiator
      - startedAt
      - currentTasks
      - steps
      - variables
      properties:
        ended:
          type: boolean
          description: Legacy completion flag
        tasks:
          type: array
          description: Legacy alias of steps
          items:
            $ref: '#/components/schemas/HistoryStep'
        id:
          type: string
        processKey:
          type: string
        businessKey:
          type: string
        workspace:
          type: string
        initiator:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        currentTasks:
          type: array
          items:
            $ref: '#/components/schemas/WorkItem'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/HistoryStep'
        variables:
          type: object
          description: Nội dung người tạo nhập lúc tạo yêu cầu, theo key của startFields
          additionalProperties:
            type: string
    HistoryStep:
      type: object
      required:
      - key
      - name
      - startedAt
      properties:
        id:
          type: string
        actor:
          type: string
          nullable: true
          description: Legacy alias of assignee
        key:
          type: string
        name:
          type: string
        assignee:
          type: string
          nullable: true
        outcome:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        claimedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
    WorkItem:
      type: object
      required:
      - id
      - processInstanceId
      - key
      - name
      - candidateGroups
      - createdAt
      - processKey
      - businessKey
      properties:
        id:
          type: string
        processInstanceId:
          type: string
        key:
          type: string
          description: id của userTask trong BPMN
        name:
          type: string
        candidateGroups:
          type: array
          items:
            type: string
            example: lab-a:coordinator
        assignee:
          type: string
          nullable: true
          description: null nếu chưa ai nhận
        createdAt:
          type: string
          format: date-time
        processKey:
          type: string
        businessKey:
          type: string
    ProcessHandle:
      type: object
      required:
      - processInstanceId
      - processKey
      - businessKey
      - workspace
      properties:
        id:
          type: string
          description: Legacy alias of processInstanceId
        processInstanceId:
          type: string
        processKey:
          type: string
        businessKey:
          type: string
        workspace:
          type: string
    ProcessOption:
      type: object
      required:
      - key
      - label
      properties:
        key:
          type: string
          description: Giá trị gửi lên server (outcome, tên biến)
        label:
          type: string
          description: Nhãn hiển thị; thiếu nhãn thì bằng key
    ProcessStartField:
      type: object
      required:
      - key
      - label
      - multiline
      properties:
        key:
          type: string
          description: Tên biến gửi lên khi tạo
        label:
          type: string
        multiline:
          type: boolean
          description: Ô nhiều dòng, tối đa 2000 ký tự; ô thường tối đa 200
    ProcessDescriptor:
      type: object
      required:
      - processKey
      - name
      - canStart
      - tasks
      - startFields
      properties:
        processKey:
          type: string
        name:
          type: string
        canStart:
          type: boolean
          description: Người gọi được tạo yêu cầu từ form chung
        tasks:
          type: array
          items:
            type: object
            required:
            - key
            - name
            - outcomes
            properties:
              key:
                type: string
                description: id của userTask trong BPMN
              name:
                type: string
              outcomes:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessOption'
        startFields:
          type: array
          items:
            $ref: '#/components/schemas/ProcessStartField'
    ProcessSummary:
      type: object
      required:
      - id
      - processKey
      - businessKey
      - initiator
      - startedAt
      - activeTaskKeys
      properties:
        id:
          type: string
        processKey:
          type: string
        businessKey:
          type: string
        initiator:
          type: string
          description: subject người tạo
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        activeTaskKeys:
          type: array
          description: Bước đang mở; rỗng khi đã kết thúc
          items:
            type: string
    ProcessSummaryPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ProcessSummary'
    WorkspacePermission:
      type: object
      required:
      - key
      - label
      properties:
        key:
          type: string
          example: request:create
        label:
          type: string
          description: Mô tả tiếng Việt khai báo trong Keycloak; không có thì bằng key
          example: Tạo yêu cầu
    ActivityEntry:
      type: object
      required:
      - id
      - occurredAt
      - actor
      - action
      - resourceType
      - resource
      - details
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
          description: subject người thực hiện
        action:
          type: string
          description: Dạng <đối tượng>.<động từ>, ví dụ process.start, task.claim, task.complete, file.upload
        resourceType:
          type: string
        resource:
          type: string
        processInstanceId:
          type: string
          nullable: true
          description: Quy trình liên quan để mở trang tiến độ; null nếu không thuộc quy trình
        processKey:
          type: string
          nullable: true
        details:
          type: object
          description: Tham chiếu an toàn (taskKey, outcome, businessKey...)
          additionalProperties:
            type: string
    ActivityPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ActivityEntry'
    ProcessStatistics:
      type: object
      required:
      - from
      - to
      - processes
      - daily
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        processes:
          type: array
          items:
            type: object
            required:
            - processKey
            - started
            - running
            - completed
            - waitingClaim
            - inProgress
            properties:
              processKey:
                type: string
              started:
                type: integer
                format: int64
              running:
                type: integer
                format: int64
              completed:
                type: integer
                format: int64
              averageCompletionSeconds:
                type: integer
                format: int64
                nullable: true
              waitingClaim:
                type: integer
                format: int64
              inProgress:
                type: integer
                format: int64
        daily:
          type: array
          items:
            type: object
            required:
            - date
            - started
            properties:
              date:
                type: string
                format: date
              started:
                type: integer
                format: int64
    KnowledgeRecord:
      type: object
      required:
      - id
      - workspace
      - title
      - source
      - version
      - usageRights
      - checksum
      - owner
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspace:
          type: string
        title:
          type: string
        source:
          type: string
        version:
          type: string
        usageRights:
          type: string
        checksum:
          type: string
        fileId:
          type: string
          format: uuid
          nullable: true
        owner:
          type: string
        ownerName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    PageMeta:
      type: object
      required:
      - page
      - size
      - total
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    Actor:
      type: object
      required:
      - subject
      - workspace
      - roles
      - capabilities
      properties:
        subject:
          type: string
        workspace:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
    WorkPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/WorkItem'
    AuthorizedKnowledge:
      type: object
      required:
      - metadataId
      - workspace
      - title
      - version
      - checksum
      - usageRights
      - mediaType
      - content
      - text
      properties:
        workspace:
          type: string
        title:
          type: string
        version:
          type: string
        checksum:
          type: string
        usageRights:
          type: string
        mediaType:
          type: string
        metadataId:
          type: string
          format: uuid
        content:
          type: string
          format: byte
        text:
          type: string
          description: Cùng nội dung với content, đã giải UTF-8 để hiển thị
    WorkspaceContext:
      type: object
      required:
      - workspace
      - name
      - roles
      properties:
        workspace:
          type: string
        name:
          type: string
          description: Tên hiển thị (thuộc tính displayName của group Keycloak); không có thì bằng workspace
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
    WorkspaceMember:
      type: object
      required:
      - subject
      - username
      - fullName
      - roles
      properties:
        subject:
          type: string
          description: sub của Keycloak, trùng owner/actor ở các API khác
        username:
          type: string
        fullName:
          type: string
          nullable: true
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
    KnowledgeSummary:
      type: object
      required:
      - id
      - workspace
      - title
      - source
      - version
      - usageRights
      - owner
      - ownerName
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspace:
          type: string
        title:
          type: string
        source:
          type: string
        version:
          type: string
        usageRights:
          type: string
        owner:
          type: string
        ownerName:
          type: string
          nullable: true
          description: Tên người tạo theo danh bạ; null khi danh bạ không phản hồi hoặc người tạo đã rời workspace
        createdAt:
          type: string
          format: date-time
    KnowledgePage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/KnowledgeSummary'
          description: Authorized exact bytes, Base64 encoded
    TriageSuggestion:
      type: object
      required:
      - status
      - result
      - evidence
      - explanation
      - needsReview
      - profileVersion
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - DEGRADED
        result:
          type: object
          nullable: true
          properties:
            category:
              type: string
            priority:
              type: string
            suggestedGroup:
              type: string
        evidence:
          type: array
          items:
            type: object
            required:
            - field
            - text
            properties:
              field:
                type: string
                enum:
                - title
                - description
              text:
                type: string
        explanation:
          type: string
          nullable: true
        needsReview:
          type: boolean
        profileVersion:
          type: string
          nullable: true
  parameters:
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Workspace:
      name: workspace
      in: path
      required: true
      schema:
        type: string
        example: lab-a
  responses:
    ServiceUnavailable:
      description: SERVICE_UNAVAILABLE – dịch vụ phụ thuộc (danh bạ Keycloak) không phản hồi, thử lại sau
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Duplicate business key or task transition is no longer valid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found in caller scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: FORBIDDEN – không thuộc workspace hoặc thiếu vai trò
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: UNAUTHENTICATED – thiếu/sai/hết hạn token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid input or unknown JSON property
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
