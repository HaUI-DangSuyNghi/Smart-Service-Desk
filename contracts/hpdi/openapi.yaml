openapi: 3.0.3
info:
  title: H-P-D-I shared capability API
  version: 0.1.0
  description: Tier-2 contracts; no engine or domain policy types. Java-only start/contribution/Intelligence
    contracts are documented beside this specification.
security:
- bearerAuth: []
paths:
  /api/hpdi/v1/workspaces/{workspace}/schedules:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
    get:
      operationId: listAgentSchedules
      description: Coordinator with task:assign reads the current workspace Agent roster; Agent with task:handle reads only their own schedule.
      responses:
        '200':
          description: Current schedules; version zero means legacy manual duty
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AgentSchedule'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/hpdi/v1/workspaces/{workspace}/schedules/{subject}:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {name: subject, in: path, required: true, schema: {type: string, maxLength: 100}, description: Current Agent subject or me}
    get:
      operationId: getAgentSchedule
      description: Coordinator with task:assign or own Agent with task:handle. Current membership required.
      responses:
        '200':
          description: Current schedule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSchedule'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: replaceAgentSchedule
      description: >-
        Coordinator with task:assign replaces the complete date-specific schedule using the last read version
        (zero for first creation). Explicit enabled=true opts into schedule enforcement; empty shifts with
        enabled=true means no eligible shift. enabled=false restores manual-only behavior. Omit a shift
        to cancel it. Previous shift versions and transactional audit are retained. No recurring/leave API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, enabled, shifts]
              properties:
                version: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775806}
                enabled: {type: boolean}
                shifts: {type: array, maxItems: 366, items: {$ref: '#/components/schemas/AgentShift'}}
      responses:
        '200':
          description: Committed schedule with incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSchedule'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/hpdi/v1/workspaces/{workspace}/schedules/{subject}/effective-duty:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {name: subject, in: path, required: true, schema: {type: string, maxLength: 100}}
    get:
      operationId: getEffectiveDuty
      description: Coordinator with task:assign or own Agent with task:handle; current membership required. Does not mutate manual duty or work execution.
      responses:
        '200':
          description: Evaluated duty at server time; start inclusive and end exclusive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EffectiveDuty'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/release:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: releaseWork
      description: >-
        Trả việc về điều phối viên (R6: sai tổ…; R3: hết ca bàn giao). Bắt buộc lý do;
        bàn giao phải ghi đã làm đến đâu. Việc quay lại hàng chờ duyệt, thời gian đã làm được giữ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, note]
              properties:
                reason: {type: string, enum: [WRONG_GROUP, HANDOVER, OTHER]}
                note: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '204': {description: Đã trả việc}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/estimate-requests:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: requestEstimateChange
      description: Người đang giữ việc xin sửa ET kèm lý do. 409 nếu đã có yêu cầu đang chờ cho việc này.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposedMinutes, reason]
              properties:
                proposedMinutes: {type: integer, minimum: 1, maximum: 10080}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '201':
          description: Yêu cầu đã tạo, chờ điều phối viên
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EstimateRequest'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/hpdi/v1/workspaces/{workspace}/estimate-requests:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
    get:
      operationId: listEstimateRequests
      description: Điều phối viên xem yêu cầu sửa ET (quyền task:assign); kỹ thuật viên chỉ thấy yêu cầu của mình. Mới nhất trước.
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/EstimateRequestStatus'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Một trang yêu cầu
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMeta'}
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/EstimateRequest'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/hpdi/v1/workspaces/{workspace}/estimate-requests/{requestId}/decision:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: decideEstimateRequest
      description: Điều phối viên đồng ý (ET đổi thành proposedMinutes, nguồn COORDINATOR) hoặc từ chối. 409 nếu đã quyết.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approved]
              properties:
                approved: {type: boolean}
                note: {type: string, maxLength: 1000}
      responses:
        '200':
          description: Yêu cầu sau khi quyết
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EstimateRequest'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/hpdi/v1/workspaces/{workspace}/alerts:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
    get:
      operationId: listAlerts
      description: >-
        Cảnh báo gửi cho người gọi, mới nhất trước. FE gọi định kỳ (polling); since để chỉ lấy cảnh báo mới.
        Kỹ thuật viên nhận cảnh báo về việc mình giữ; điều phối viên nhận cảnh báo của cả workspace.
      parameters:
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}, description: Chỉ lấy cảnh báo tạo sau mốc này}
        - {name: unreadOnly, in: query, required: false, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Một trang cảnh báo
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMeta'}
                  - type: object
                    required: [items, unread]
                    properties:
                      unread: {type: integer, minimum: 0, description: Total visible unread alerts for the caller}
                      items: {type: array, items: {$ref: '#/components/schemas/Alert'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/hpdi/v1/workspaces/{workspace}/alerts/{alertId}/read:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {name: alertId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: markAlertRead
      description: Đánh dấu đã đọc; gọi lặp vẫn 204.
      responses:
        '204': {description: Đã đọc}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/assignment-suggestion:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    - name: id
      in: path
      required: true
      schema: {type: string}
    get:
      operationId: assignmentSuggestion
      description: Read-only Coordinator/task:assign suggestion for an active reviewed Service Desk handle task. Available only in the Service Desk assembly. Does not reserve or assign an agent. Unsupported processes return 409. Review-time preview is an application endpoint.
      responses:
        '200':
          description: Current candidates and recommendation; no eligible agent or OTHER returns null recommended.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentSuggestion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/hpdi/v1/workspaces/{workspace}/duty:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    get:
      operationId: listDuty
      description: Shared HPDI human capability, available without Service Desk. Agents see their own duty; coordinators with task:assign see current workspace agents. Missing duty defaults to off. No schedules.
      responses:
        '200':
          description: Current agent duty states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DutyStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/duty/{subject}:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    - name: subject
      in: path
      required: true
      schema:
        type: string
      description: Own subject or me. Changing another agent is forbidden, including for coordinators.
    put:
      operationId: setDuty
      description: Agent with current membership and task:handle changes only their own persisted duty. Does not interrupt work. Audit and duty commit atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [onDuty]
              properties:
                onDuty:
                  type: boolean
                note:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        '200':
          description: Persisted duty status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/queue:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    get:
      operationId: getQueue
      description: Own agent queue; another assignee requires coordinator and task:assign. IN_PROGRESS first, native
        priority descending, due date then creation/id. Full-queue remaining load; no SLA/aging/shift projection.
      parameters:
      - name: assignee
        in: query
        required: false
        schema:
          type: string
        description: subject; bỏ trống = chính mình
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang hàng đợi đã sắp xếp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/start:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    post:
      operationId: startWork
      description: Reviewed work only. JWT, workspace and current permissions required. No SLA, aging, duty or predicted-start
        calculation.
      responses:
        '200':
          description: Việc sau khi bắt đầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/pause:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    post:
      operationId: pauseWork
      description: Reviewed work only. JWT, workspace and current permissions required. No SLA, aging, duty or predicted-start
        calculation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  $ref: '#/components/schemas/PendingReason'
                note:
                  type: string
                  maxLength: 1000
                  description: Bắt buộc khi reason = OTHER
      responses:
        '200':
          description: Việc sau khi tạm dừng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/resume:
    parameters:
    - $ref: '#/components/parameters/Workspace'
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    post:
      operationId: resumeWork
      description: Reviewed work only. JWT, workspace and current permissions required. No SLA, aging, duty or predicted-start
        calculation.
      responses:
        '200':
          description: Việc sau khi tiếp tục
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/hpdi/v1/workspaces/{workspace}/actor:
    parameters:
    - &id001
      $ref: '#/components/parameters/Workspace'
    get:
      responses:
        '200':
          description: Authorized capability projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hpdi/v1/workspaces/{workspace}/processes:
    parameters:
    - *id001
    get:
      description: Mọi quy trình đã đăng ký kèm nhãn hiển thị, kết quả hợp lệ theo bước và canStart của người gọi.
      responses:
        '200':
          description: Danh mục quy trình, sắp theo tên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessDescriptor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/processes/statistics:
    parameters:
    - *id001
    get:
      description: Số liệu dashboard (quyền dashboard:view). started/running/completed tính trên yêu cầu tạo trong [from, to); waitingClaim/inProgress là việc đang mở lúc gọi. Khoảng tối đa 366 ngày.
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: zone
        in: query
        description: Múi giờ IANA để chia số liệu theo ngày
        schema:
          type: string
          default: UTC
          example: Asia/Ho_Chi_Minh
      responses:
        '200':
          description: Số liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessStatistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/assign:
    parameters:
    - *id001
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Giao (lại) việc (quyền task:assign, Core yêu cầu coordinator). Chỉ giao cho người thuộc nhóm xử lý của bước, không giao cho người tạo yêu cầu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - assignee
              properties:
                assignee:
                  type: string
                  description: subject người được giao
      responses:
        '200':
          description: Việc sau khi giao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/processes/{processKey}/instances:
    parameters:
    - *id001
    - name: processKey
      in: path
      required: true
      schema:
        type: string
    post:
      description: Tạo yêu cầu từ form chung. Chỉ quy trình tự phục vụ (canStart); businessKey do server sinh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                variables:
                  type: object
                  description: Chỉ các key trong startFields; ô một dòng ≤ 200 ký tự, ô multiline ≤ 2000
                  additionalProperties:
                    type: string
                    maxLength: 2000
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessHandle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hpdi/v1/workspaces/{workspace}/instances:
    parameters:
    - *id001
    get:
      description: Yêu cầu, mới nhất trước. scope=mine (mặc định, cần request:create) là yêu cầu người gọi đã tạo; scope=all (cần request:view-all) là mọi yêu cầu người gọi được xem với tư cách reader.
      parameters:
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - mine
          - all
          default: mine
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/inbox:
    parameters:
    - *id001
    get:
      responses:
        '200':
          description: Authorized capability projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - ASSIGNED
          - CANDIDATE
          - ALL
          default: CANDIDATE
        description: ASSIGNED/CANDIDATE cần quyền task:handle; ALL (mọi việc đang mở, để giao việc) cần task:assign
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
  /api/hpdi/v1/workspaces/{workspace}/instances/{id}/timeline:
    parameters:
    - *id001
    - &id002
      name: id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Authorized capability projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessTimeline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/claim:
    parameters:
    - *id001
    - *id002
    post:
      responses:
        '200':
          description: Authorized capability projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hpdi/v1/workspaces/{workspace}/tasks/{id}/complete:
