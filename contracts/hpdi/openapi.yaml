        schema:
          type: string
          format: date-time
      - name: action
        in: query
        schema:
          type: string
      - name: actor
        in: query
        description: subject người thực hiện
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang nhật ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/permissions:
    parameters:
    - *id001
    get:
      description: Quyền của người gọi trong workspace – gộp quyền (role của client dx-permissions trong Keycloak) của các vai trò người gọi có; vai trò lấy từ token. Chỉ để hiển thị.
      responses:
        '200':
          description: Quyền, sắp theo tên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspacePermission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/hpdi/v1/workspaces/{workspace}/activity:
    parameters:
    - *id001
    get:
      description: Hoạt động của tôi – thao tác do chính người gọi làm trong workspace (lấy từ audit), mới nhất trước. Mọi thành viên workspace được xem; người thực hiện luôn lấy từ token.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/knowledge:
    parameters:
    - *id001
    get:
      description: Requires document:view. TXT, Markdown, text PDFs and DOCX in the workspace, newest first.
      parameters:
      - name: q
        in: query
        description: Tìm theo tiêu đề, không phân biệt hoa thường
        schema:
          type: string
          maxLength: 200
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Một trang tài liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/knowledge/chat:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
    post:
      operationId: chatWithKnowledge
      description: >-
        Requires document:view. Server resolves authorized documents, retrieves exact excerpts,
        then streams provider text. Data-only SSE events are status, sources, delta, done, error.
        Sources include index, metadataId, title, version, excerpt. Delta includes text.
        Done includes grounded; only a done event confirms successful completion.
        Error leaves any partial answer unverified. No conversation or arbitrary context is accepted.
        Empty documentIds searches the whole workspace, limited to 50 documents and 1 MB extracted UTF-8.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, documentIds]
              properties:
                question: {type: string, minLength: 1, maxLength: 2000}
                documentIds: {type: array, maxItems: 50, uniqueItems: true, items: {type: string, format: uuid}}
      responses:
        '200':
          description: SSE stream; original document bytes are never sent to the model.
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/hpdi/v1/workspaces/{workspace}/knowledge/{id}:
    parameters:
    - *id001
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      responses:
        '200':
          description: Authorized capability projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hpdi/v1/workspaces/{workspace}/knowledge/{id}/record:
    parameters:
    - *id001
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      description: Provenance của một tài liệu cho trang chi tiết (quyền document:view).
      responses:
        '200':
          description: Provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hpdi/v1/settings/work:
    get:
      operationId: getWorkSettings
      description: Fresh platform-admin only. Persistent administrative settings; PERSISTED_NOT_ENFORCED.
        No runtime consumer wiring. R7 remains blocked.
      responses:
        '200':
          description: Cấu hình hiện hành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateWorkSettings
      description: Fresh platform-admin only. Persistent administrative settings; PERSISTED_NOT_ENFORCED.
        No runtime consumer wiring. R7 remains blocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkSettings'
      responses:
        '200':
          description: Cấu hình sau khi lưu, version mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    WorkSettings:
      type: object
      additionalProperties: false
      description: 'Storage-only foundation. SLA seed matches r5-v1: 510 working minutes/day;
        LOW 510/2550, MEDIUM 240/1020. Closing seed 3 preserves 72 continuous hours; no
        runtime wiring. Shifts must be nonblank/unique, ordered start<end and non-overlapping;
        resolve>=start; outlierMax>=outlierMin. All changes are audited; PUT rejects read-only
        metadata and unknown fields.'
      required:
      - version
      - assignment
      - shifts
      - sla
      - critical
      - alerts
      - closing
      - estimate
      properties:
        version:
          type: integer
          minimum: 0
          description: Tăng mỗi lần lưu; PUT phải gửi version đang xem
          maximum: 9223372036854775807
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          readOnly: true
        assignment:
          type: object
          additionalProperties: false
          required:
          - pendingLoadFactor
          - tieThresholdMinutes
          - maxInProgress
          - minRemainingMinutes
          properties:
            pendingLoadFactor:
              type: number
              minimum: 0
              maximum: 1
              description: Mặc định 0,5
            tieThresholdMinutes:
              type: integer
              minimum: 0
              description: Mặc định 15
              maximum: 2147483647
            maxInProgress:
              type: integer
              minimum: 1
              description: Mặc định 1
              maximum: 2147483647
            minRemainingMinutes:
              type: integer
              minimum: 0
              description: Phần còn lại tối thiểu của việc Đang làm, mặc định 10
              maximum: 2147483647
        shifts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Shift'
          description: Mặc định Sáng 07:00–11:30, Chiều 13:00–17:00
        sla:
          type: object
          additionalProperties: false
          required:
          - targets
          - escalateAfterRatio
          - maxEscalatedPriority
          - waitingExternalCounts
          properties:
            targets:
              type: object
              additionalProperties: false
              required:
              - LOW
              - MEDIUM
              - HIGH
              - CRITICAL
              description: Working-minute targets except CRITICAL continuous minutes.
                Seed LOW 510/2550, MEDIUM 240/1020, HIGH 60/480, CRITICAL 15/120. Runtime
                policy remains r5-v1 and is not changed by PUT.
              properties:
                LOW:
                  $ref: '#/components/schemas/SlaTarget'
                MEDIUM:
                  $ref: '#/components/schemas/SlaTarget'
                HIGH:
                  $ref: '#/components/schemas/SlaTarget'
                CRITICAL:
                  $ref: '#/components/schemas/SlaTarget'
            escalateAfterRatio:
              type: number
              minimum: 0
              maximum: 1
              description: Chờ quá tỉ lệ này của hạn bắt đầu thì lên 1 bậc, mặc định 0,5
            maxEscalatedPriority:
              $ref: '#/components/schemas/Priority'
            waitingExternalCounts:
              type: boolean
              description: Chờ linh kiện / bên ngoài có tính vào hạn, mặc định true
        critical:
          type: object
          additionalProperties: false
          required:
          - autoQueueAfterMinutes
          properties:
            autoQueueAfterMinutes:
              type: integer
              minimum: 1
              description: Mặc định 5
              maximum: 2147483647
        alerts:
          type: object
          additionalProperties: false
          required:
          - warnRemainingRatio
          - pendingRemindDays
          - reopenUnclaimedMinutes
          properties:
            warnRemainingRatio:
              type: number
              minimum: 0
              maximum: 1
              description: Mặc định 0,2
            pendingRemindDays:
              type: integer
              minimum: 1
              description: Mặc định 3
              maximum: 2147483647
            reopenUnclaimedMinutes:
              type: integer
              minimum: 1
              description: Mặc định 15
              maximum: 2147483647
        closing:
          type: object
          additionalProperties: false
          required:
          - autoCloseAfterDays
          properties:
            autoCloseAfterDays:
              type: integer
              minimum: 1
              description: Tự đóng nếu người dùng không xác nhận, mặc định 3
              maximum: 2147483647
        estimate:
          type: object
          additionalProperties: false
          required:
          - minSamples
          - windowMonths
          - outlierMinMinutes
          - outlierMaxMinutes
          properties:
            minSamples:
              type: integer
              minimum: 1
              description: Mặc định 20
              maximum: 2147483647
            windowMonths:
              type: integer
              minimum: 1
              description: Mặc định 6
              maximum: 2147483647
            outlierMinMinutes:
              type: integer
              minimum: 0
              description: Mặc định 2
              maximum: 2147483647
            outlierMaxMinutes:
              type: integer
              minimum: 1
              description: Mặc định 480 (8 giờ)
              maximum: 2147483647
    Shift:
      type: object
      additionalProperties: false
      required:
      - name
      - start
      - end
      properties:
        name:
          type: string
          maxLength: 50
        start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: 07:00
        end:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: '11:30'
    SlaTarget:
      type: object
      additionalProperties: false
      required:
      - startWithinMinutes
      - resolveWithinMinutes
      properties:
        startWithinMinutes:
          type: integer
          minimum: 1
          maximum: 2147483647
        resolveWithinMinutes:
          type: integer
          minimum: 1
          maximum: 2147483647
    EstimateRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, SUPERSEDED]
      description: Assignment changes atomically supersede pending requests from the previous assignee. Terminal requests cannot be decided.
    EstimateRequest:
      type: object
      additionalProperties: false
      required: [id, taskId, processInstanceId, businessKey, label, requestedBy, currentMinutes, proposedMinutes, reason, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: string}
        processInstanceId: {type: string}
        businessKey: {type: string}
        label: {type: string}
        requestedBy: {type: string}
        currentMinutes: {type: integer, minimum: 1}
        proposedMinutes: {type: integer, minimum: 1}
        reason: {type: string}
        status: {$ref: '#/components/schemas/EstimateRequestStatus'}
        decidedBy: {type: string, nullable: true}
        decidedAt: {type: string, format: date-time, nullable: true}
        decisionNote: {type: string, nullable: true}
        supersededBy: {type: string, nullable: true, description: Actor triggering assignment supersession; not a decision.}
        supersededAt: {type: string, format: date-time, nullable: true}
        supersededReason: {type: string, nullable: true, enum: [ASSIGNMENT_CHANGED, CLASSIFICATION_CHANGED, null], description: Persisted invalidation reason; null unless superseded.}
        createdAt: {type: string, format: date-time}
    Alert:
      type: object
      additionalProperties: false
      required: [id, type, severity, processInstanceId, processKey, businessKey, label, createdAt]
      properties:
        id: {type: string, format: uuid}
        type:
          type: string
          description: >-
            Persistent deadline, pending, duty and critical notifications. CRITICAL_NEW labels
            distinguish unapproved AI advice from a Coordinator-approved decision. No emergency auto-queue producer; CRITICAL_UNREVIEWED reminds Coordinators once when AI-advised CRITICAL work stays unreviewed past critical.autoQueueAfterMinutes.
          enum: [START_OVERDUE, SLA_WARNING, SLA_BREACHED, PENDING_TOO_LONG, CRITICAL_NEW, ASSIGNEE_OFF_DUTY, NO_ONE_ON_DUTY, CLASSIFICATION_CHANGED, REOPENED, REOPEN_UNCLAIMED, CRITICAL_UNREVIEWED]
        severity: {type: string, enum: [INFO, WARNING, CRITICAL]}
        taskId: {type: string, nullable: true}
        processInstanceId: {type: string}
        processKey: {type: string}
        businessKey: {type: string}
        label: {type: string}
        createdAt: {type: string, format: date-time}
        readAt: {type: string, format: date-time, nullable: true}
    AssignmentCandidate:
      type: object
      additionalProperties: false
      required: [subject, displayName, onDuty, loadMinutes, assignedToday, recommended]
      properties:
        subject: {type: string}
        displayName: {type: string}
        onDuty: {type: boolean}
        loadMinutes: {type: integer, format: int64, minimum: 0, description: 'Other assigned execution workload, excluding only the task being considered for assignment. Preview excludes no existing handle task.'}
        assignedToday: {type: integer, format: int64, minimum: 0}
        shiftRemainingMinutes: {type: integer, minimum: 0, nullable: true, description: Whole minutes until current enabled shift ends; null for manual-only or outside a shift. Compare with estimateMinutes; ESTIMATE_EXCEEDS_SHIFT in reason requires Coordinator overtime or R6 handover decision.}
        recommended: {type: boolean}
        excludedReason: {type: string, nullable: true, enum: [OFF_DUTY, IS_REQUESTER, null]}
    AssignmentSuggestion:
      type: object
      additionalProperties: false
      required: [taskId, group, estimateMinutes, candidates, reason]
      properties:
        taskId: {type: string}
        group: {type: string, description: Support group or manual for OTHER.}
        estimateMinutes: {type: integer, minimum: 1}
        recommended: {type: string, nullable: true}
        reason: {type: string}
        candidates: {type: array, items: {$ref: '#/components/schemas/AssignmentCandidate'}}
    DutyStatus:
      type: object
      additionalProperties: false
      required: [subject, onDuty, note, updatedAt, effectiveDuty]
      properties:
        effectiveDuty:
          type: boolean
          description: Manual onDuty AND current shift when schedule enforcement is enabled; otherwise manual onDuty. New assignments use this value.
        subject:
          type: string
        onDuty:
          type: boolean
        note:
          type: string
          nullable: true
          maxLength: 500
        updatedAt:
          type: string
          format: date-time
          nullable: true
    AgentShift:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        startsAt: {type: string, format: date-time, description: Absolute instant including offset; inclusive}
        endsAt: {type: string, format: date-time, description: Absolute instant including offset; exclusive; after start and at most 24 hours later}
        timezone: {type: string, maxLength: 100, default: Asia/Ho_Chi_Minh, description: IANA timezone; stored with absolute instants. No implicit UTC local time conversion.}
    AgentSchedule:
      type: object
      additionalProperties: false
      required: [subject, version, enabled, shifts]
      properties:
        subject: {type: string}
        version: {type: integer, format: int64, minimum: 0}
        enabled: {type: boolean}
        shifts: {type: array, items: {$ref: '#/components/schemas/AgentShift'}}
    EffectiveDuty:
      type: object
      additionalProperties: false
      required: [manualDuty, scheduleEnabled, scheduledDuty, onDuty, shiftStart, shiftEnd, shiftRemainingMinutes, scheduleVersion, reason]
      properties:
        manualDuty: {type: boolean}
        scheduleEnabled: {type: boolean}
        scheduledDuty: {type: boolean}
        onDuty: {type: boolean}
        shiftStart: {type: string, format: date-time, nullable: true}
        shiftEnd: {type: string, format: date-time, nullable: true}
        shiftRemainingMinutes: {type: integer, minimum: 0, nullable: true}
        scheduleVersion: {type: integer, format: int64, minimum: 0}
        reason: {type: string, enum: [MANUAL_OFF_DUTY, OUTSIDE_SHIFT, SCHEDULE_AND_MANUAL, LEGACY_MANUAL]}
    Priority:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    WorkState:
      type: string
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - PENDING
    PendingReason:
      type: string
      enum:
      - WAITING_REQUESTER
      - WAITING_PARTS
      - WAITING_EXTERNAL
      - OTHER
    Estimate:
      type: object
      additionalProperties: false
      required:
      - minutes
      - basis
      properties:
        minutes:
          type: integer
          minimum: 1
          maximum: 10080
        basis:
          type: string
          description: DEFAULT = settings table; SIMILAR = median worked time of closed work with the same category and priority (enough samples); COORDINATOR = set or approved by a coordinator.
          enum:
          - DEFAULT
          - COORDINATOR
          - SIMILAR
        sampleSize:
          type: integer
          minimum: 1
          description: Number of closed work items behind the median; present only when basis is SIMILAR.
    Sla:
      type: object
      additionalProperties: false
      description: R5 policy snapshot from coordinator approval. UTC deadlines; CRITICAL is continuous, other priorities use the configured business calendar.
      required: [startBy, resolveBy, startBreached, resolveBreached, warning, clockPaused]
      properties:
        startBy: {type: string, format: date-time}
        resolveBy: {type: string, format: date-time}
        startBreached: {type: boolean, description: 'Ever breached the start SLA in this generation or its handover lineage; remains true after a priority amendment. Not a current-overdue indicator.'}
        resolveBreached: {type: boolean, description: 'Ever breached the resolution SLA in this generation or its handover lineage; remains true after a priority amendment. Not a current-overdue indicator.'}
        warning: {type: boolean}
        clockPaused: {type: boolean}
    QueueItem:
      allOf:
      - $ref: '#/components/schemas/WorkItem'
      - type: object
        required:
        - label
        - workState
        - priority
        - basePriority
        - estimate
        - workedMinutes
        - remainingMinutes
        - reopenCount
        properties:
          label:
            type: string
            maxLength: 200
          workState:
            $ref: '#/components/schemas/WorkState'
          priority:
            $ref: '#/components/schemas/Priority'
          basePriority:
            $ref: '#/components/schemas/Priority'
          estimate:
            $ref: '#/components/schemas/Estimate'
          workedMinutes:
            type: integer
            minimum: 0
          remainingMinutes:
            type: integer
            minimum: 0
          reopenCount:
            type: integer
            minimum: 0
          pendingReason:
            type: string
            nullable: true
            enum: [WAITING_REQUESTER, WAITING_PARTS, WAITING_EXTERNAL, OTHER, null]
          pendingNote:
            type: string
            nullable: true
          sla:
            anyOf:
            - $ref: '#/components/schemas/Sla'
            - {type: object, nullable: true, enum: [null]}
    QueuePage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        - assignee
        - loadMinutes
        properties:
          assignee:
            type: string
          loadMinutes:
            type: integer
            minimum: 0
          items:
            type: array
            items:
              $ref: '#/components/schemas/QueueItem'
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - requestId
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Forbidden
        status:
          type: integer
          example: 403
        detail:
          type: string
          example: Workspace access denied
        instance:
          type: string
        code:
          type: string
          enum:
          - VALIDATION_FAILED
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - PAYLOAD_TOO_LARGE
          - UNSUPPORTED_MEDIA_TYPE
          - SERVICE_UNAVAILABLE
        requestId:
          type: string
          description: Trùng header X-Request-ID
    ProcessTimeline:
      type: object
      required:
      - id
      - processKey
      - businessKey
      - workspace
      - initiator
      - startedAt
      - currentTasks
      - steps
      - variables
      properties:
        ended:
          type: boolean
          description: Legacy completion flag
        tasks:
          type: array
          description: Legacy alias of steps
          items:
            $ref: '#/components/schemas/HistoryStep'
        id:
          type: string
        processKey:
          type: string
        businessKey:
          type: string
        workspace:
          type: string
        initiator:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        currentTasks:
          type: array
          items:
            $ref: '#/components/schemas/WorkItem'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/HistoryStep'
        variables:
          type: object
          description: Nội dung người tạo nhập lúc tạo yêu cầu, theo key của startFields
          additionalProperties:
            type: string
    HistoryStep:
      type: object
      required:
      - key
      - name
      - startedAt
      properties:
        id:
          type: string
        actor:
          type: string
          nullable: true
          description: Legacy alias of assignee
        key:
          type: string
        name:
          type: string
        assignee:
          type: string
          nullable: true
        outcome:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        claimedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
    WorkItem:
      type: object
      required:
      - id
      - processInstanceId
      - key
      - name
      - candidateGroups
      - createdAt
      - processKey
      - businessKey
      properties:
        id:
          type: string
        processInstanceId:
          type: string
        key:
          type: string
          description: id của userTask trong BPMN
        name:
          type: string
        candidateGroups:
          type: array
          items:
            type: string
            example: lab-a:coordinator
        assignee:
          type: string
          nullable: true
          description: null nếu chưa ai nhận
        createdAt:
          type: string
          format: date-time
        processKey:
          type: string
        businessKey:
          type: string
    ProcessHandle:
      type: object
      required:
      - processInstanceId
      - processKey
      - businessKey
      - workspace
      properties:
        id:
          type: string
          description: Legacy alias of processInstanceId
        processInstanceId:
          type: string
        processKey:
          type: string
        businessKey:
          type: string
        workspace:
          type: string
    ProcessOption:
      type: object
      required:
      - key
      - label
      properties:
        key:
          type: string
          description: Giá trị gửi lên server (outcome, tên biến)
        label:
          type: string
          description: Nhãn hiển thị; thiếu nhãn thì bằng key
    ProcessStartField:
      type: object
      required:
      - key
      - label
      - multiline
      properties:
        key:
          type: string
          description: Tên biến gửi lên khi tạo
        label:
          type: string
        multiline:
          type: boolean
          description: Ô nhiều dòng, tối đa 2000 ký tự; ô thường tối đa 200
    ProcessDescriptor:
      type: object
      required:
      - processKey
      - name
      - canStart
      - tasks
      - startFields
      properties:
        processKey:
          type: string
        name:
          type: string
        canStart:
          type: boolean
          description: Người gọi được tạo yêu cầu từ form chung
        tasks:
          type: array
          items:
            type: object
            required:
            - key
            - name
            - outcomes
            properties:
              key:
                type: string
                description: id của userTask trong BPMN
              name:
                type: string
              outcomes:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessOption'
        startFields:
          type: array
          items:
            $ref: '#/components/schemas/ProcessStartField'
    ProcessSummary:
      type: object
      required:
      - id
      - processKey
      - businessKey
      - initiator
      - startedAt
      - activeTaskKeys
      properties:
        id:
          type: string
        processKey:
          type: string
        businessKey:
          type: string
        initiator:
          type: string
          description: subject người tạo
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        activeTaskKeys:
          type: array
          description: Bước đang mở; rỗng khi đã kết thúc
          items:
            type: string
    ProcessSummaryPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ProcessSummary'
    WorkspacePermission:
      type: object
      required:
      - key
      - label
      properties:
        key:
          type: string
          example: request:create
        label:
          type: string
          description: Mô tả tiếng Việt khai báo trong Keycloak; không có thì bằng key
          example: Tạo yêu cầu
    ActivityEntry:
      type: object
      required:
      - id
      - occurredAt
      - actor
      - action
      - resourceType
      - resource
      - details
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
          description: subject người thực hiện
        action:
          type: string
          description: Dạng <đối tượng>.<động từ>, ví dụ process.start, task.claim, task.complete, file.upload
        resourceType:
          type: string
        resource:
          type: string
        processInstanceId:
          type: string
          nullable: true
          description: Quy trình liên quan để mở trang tiến độ; null nếu không thuộc quy trình
        processKey:
          type: string
          nullable: true
        details:
          type: object
          description: Tham chiếu an toàn (taskKey, outcome, businessKey...)
          additionalProperties:
            type: string
    ActivityPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ActivityEntry'
    ProcessStatistics:
      type: object
      required:
      - from
      - to
      - processes
      - daily
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        processes:
          type: array
          items:
            type: object
            required:
            - processKey
            - started
            - running
            - completed
            - waitingClaim
            - inProgress
            properties:
              processKey:
                type: string
              started:
                type: integer
                format: int64
              running:
                type: integer
                format: int64
              completed:
                type: integer
                format: int64
              averageCompletionSeconds:
                type: integer
                format: int64
                nullable: true
              waitingClaim:
                type: integer
                format: int64
              inProgress:
                type: integer
                format: int64
        daily:
          type: array
          items:
            type: object
            required:
            - date
            - started
            properties:
              date:
                type: string
                format: date
              started:
                type: integer
                format: int64
    KnowledgeRecord:
      type: object
      required:
      - id
      - workspace
      - title
      - source
      - version
      - usageRights
      - checksum
      - owner
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspace:
          type: string
        title:
          type: string
        source:
          type: string
        version:
          type: string
        usageRights:
          type: string
        checksum:
          type: string
        fileId:
          type: string
          format: uuid
          nullable: true
        owner:
          type: string
        ownerName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    PageMeta:
      type: object
      required:
      - page
      - size
      - total
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    Actor:
      type: object
      required:
      - subject
      - workspace
      - roles
      - capabilities
      properties:
        subject:
          type: string
        workspace:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
    WorkPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/WorkItem'
    KnowledgePreview:
      type: object
      additionalProperties: false
      required: [metadataId, title, version, mediaType, text]
      properties:
        metadataId: {type: string, format: uuid}
        title: {type: string}
        version: {type: string}
        mediaType: {type: string}
        text: {type: string, description: Extracted text only. No original file or base64 bytes.}
    AuthorizedKnowledge:
      type: object
      required:
      - metadataId
      - workspace
      - title
      - version
      - checksum
      - usageRights
      - mediaType
      - content
      - text
      properties:
        workspace:
          type: string
        title:
          type: string
        version:
          type: string
        checksum:
          type: string
        usageRights:
          type: string
        mediaType:
          type: string
        metadataId:
          type: string
          format: uuid
        content:
          type: string
          format: byte
        text:
          type: string
          description: Cùng nội dung với content, đã giải UTF-8 để hiển thị
    WorkspaceContext:
      type: object
      required:
      - workspace
      - name
      - roles
      properties:
        workspace:
          type: string
        name:
          type: string
          description: Tên hiển thị (thuộc tính displayName của group Keycloak); không có thì bằng workspace
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
    WorkspaceMember:
      type: object
      required:
      - subject
      - username
      - fullName
      - roles
      properties:
        subject:
          type: string
          description: sub của Keycloak, trùng owner/actor ở các API khác
        username:
          type: string
        fullName:
          type: string
          nullable: true
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
    KnowledgeSummary:
      type: object
      required:
      - id
      - workspace
      - title
      - source
      - version
      - usageRights
      - owner
      - ownerName
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspace:
          type: string
        title:
          type: string
        source:
          type: string
        version:
          type: string
        usageRights:
          type: string
        owner:
          type: string
        ownerName:
          type: string
          nullable: true
          description: Tên người tạo theo danh bạ; null khi danh bạ không phản hồi hoặc người tạo đã rời workspace
        createdAt:
          type: string
          format: date-time
    KnowledgePage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/KnowledgeSummary'
    TriageSuggestion:
      type: object
      required:
      - status
      - result
      - evidence
      - explanation
      - needsReview
      - profileVersion
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - DEGRADED
        result:
          type: object
          nullable: true
          properties:
            category:
              type: string
            priority:
              type: string
            suggestedGroup:
              type: string
        evidence:
          type: array
          items:
            type: object
            required:
            - field
            - text
            properties:
              field:
                type: string
                enum:
                - title
                - description
              text:
                type: string
        explanation:
          type: string
          nullable: true
        needsReview:
          type: boolean
        profileVersion:
          type: string
          nullable: true
  parameters:
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Workspace:
      name: workspace
      in: path
      required: true
      schema:
        type: string
        example: lab-a
  responses:
    ServiceUnavailable:
      description: SERVICE_UNAVAILABLE – dịch vụ phụ thuộc (danh bạ Keycloak) không phản hồi, thử lại sau
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Duplicate business key or task transition is no longer valid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found in caller scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: FORBIDDEN – không thuộc workspace hoặc thiếu vai trò
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: UNAUTHENTICATED – thiếu/sai/hết hạn token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid input or unknown JSON property
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
