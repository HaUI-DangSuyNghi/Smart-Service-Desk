        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hpdi/v1/workspaces/{workspace}/audit:
    parameters:
    - *id001
    get:
      description: Nhật ký của cả workspace (quyền audit:view; Core yêu cầu coordinator hoặc platform-admin), mới nhất trước.
      parameters:
      - name: from
        in: query
        schema:
          type: string
