openapi: 3.0.3
info:
  title: DX-Lab Headless Core
  version: 0.1.0
  description: Local baseline. File upload/download is not implemented. Every response carries X-Request-ID (client/gateway UUID kept, otherwise generated).
servers:
  - url: http://localhost:9080/api/core/v1
security:
  - bearer: []
paths:
  /me:
    get:
      operationId: me
      description: Người dùng hiện tại; membership đọc từ group /workspaces/{workspace}/{role}.
      responses:
        '200':
          description: Verified identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /workspaces/{workspace}/metadata:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
    post:
      operationId: createMetadata
      description: Vai trò agent hoặc coordinator của workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewMetadata'}
      responses:
        '201':
          description: Persisted metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metadata'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    get:
      operationId: searchMetadata
      description: T?m metadata theo ti?u ?? (kh?ng ph?n bi?t hoa th??ng); th?nh vi?n. (P1)
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: source, in: query, schema: {type: string, maxLength: 1000}}
        - {name: sort, in: query, schema: {type: string, enum: ['createdAt,desc', 'createdAt,asc', 'title,asc', 'title,desc'], default: 'createdAt,desc'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: M?t trang metadata
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMeta'}
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Metadata'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspace}/metadata/{id}:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getMetadata
      description: Thành viên bất kỳ của workspace.
      responses:
        '200':
          description: Metadata record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metadata'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workspaces/{workspace}/processes/{processKey}/instances:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - name: processKey
        in: path
        required: true
        schema: {type: string, enum: [document-review, equipment-approval]}
    post:
      operationId: startProcess
      description: Thành viên của workspace (tạm thời, chờ starterRoles). Biến initiator/workspace do server đặt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [businessKey, title]
              properties:
                businessKey: {type: string, minLength: 1, maxLength: 200}
                title: {type: string, minLength: 1, maxLength: 200}
      responses:
        '201':
          description: Engine instance with committed scope and audit
          content:
            application/json:
              schema:
                type: object
                required: [id, processKey, businessKey, workspace]
                properties:
                  id: {type: string}
                  processKey: {type: string}
                  businessKey: {type: string}
                  workspace: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspace}/instances/{id}/tasks:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/Instance'}
    get:
      operationId: listTasks
      description: Thành viên của workspace và là người khởi tạo quy trình.
      responses:
        '200':
          description: Active engine tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, key, name]
                  properties:
                    id: {type: string}
                    key: {type: string}
                    name: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workspaces/{workspace}/instances/{id}/tasks/{taskId}/complete:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/Instance'}
      - name: taskId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: completeTask
      description: Thành viên, người khởi tạo và người đang giữ task. Tuần tự theo từng quy trình.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedTaskKey]
              properties:
                expectedTaskKey: {type: string, minLength: 1, maxLength: 100}
      responses:
        '204': {description: Task completed and audit committed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspace}/instances/{id}/history:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/Instance'}
    get:
      operationId: history
      description: Thành viên và người khởi tạo. Lịch sử lấy từ Flowable.
      responses:
        '200':
          description: Engine process and task history
          content:
            application/json:
              schema:
                type: object
                required: [id, ended, tasks]
                properties:
                  id: {type: string}
                  ended: {type: boolean}
                  tasks:
                    type: array
                    items:
                      type: object
                      required: [id, key, actor, startedAt, endedAt]
                      properties:
                        id: {type: string}
                        key: {type: string}
                        actor: {type: string}
                        startedAt: {type: string, format: date-time}
                        endedAt: {type: string, format: date-time, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workspaces/{workspace}/audit:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
    get:
      operationId: searchAudit
      description: Đọc audit, mới nhất trước; coordinator của workspace hoặc platform-admin.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: action, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Một trang audit
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMeta'}
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Workspace:
      name: workspace
      in: path
      required: true
      schema: {type: string, example: lab-a}
    Instance:
      name: id
      in: path
      required: true
      schema: {type: string}
    # Phân trang dùng chung: ?page=0&size=20
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  responses:
    Unauthorized:
      description: UNAUTHENTICATED – thiếu/sai/hết hạn token
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Forbidden:
      description: FORBIDDEN – không thuộc workspace hoặc thiếu vai trò
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound: {description: Resource not found in caller scope}
    Conflict: {description: Duplicate business key or task transition is no longer valid}
    BadRequest: {description: Invalid input or unknown JSON property}
  schemas:
    NewMetadata:
      type: object
      additionalProperties: false
      required: [title, source, version, usageRights]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        source: {type: string, minLength: 1, maxLength: 1000}
        version: {type: string, minLength: 1, maxLength: 100}
        usageRights: {type: string, minLength: 1, maxLength: 200}
        checksum: {type: string, pattern: '^[a-f0-9]{64}$'}
        fileId: {type: string, format: uuid}
    Metadata:
      type: object
      required: [id, workspace, title, source, version, usage_rights, checksum, file_id, owner, created_at]
      properties:
        id: {type: string, format: uuid}
        workspace: {type: string}
        title: {type: string}
        source: {type: string}
        version: {type: string}
        usage_rights: {type: string}
        checksum: {type: string}
        file_id: {type: string, format: uuid, nullable: true}
        owner: {type: string}
        created_at: {type: string, format: date-time}
    Me:
      type: object
      required: [sub, username, memberships, platformAdmin]
      properties:
        sub: {type: string}
        username: {type: string}
        memberships: {type: array, items: {$ref: '#/components/schemas/Membership'}}
        platformAdmin: {type: boolean}
    Membership:
      type: object
      required: [workspace, role]
      properties:
        workspace: {type: string, pattern: '^[a-z0-9-]{1,50}$'}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
    # Mặc định requester/agent/coordinator; thêm role = thêm group Keycloak, không sửa Core
    WorkspaceRole:
      type: string
      pattern: '^[a-z0-9-]{1,30}$'
      example: coordinator
    # Body lỗi chuẩn RFC 9457. 401/403 đã dùng; 400/404/409 của endpoint baseline chưa dùng.
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: {type: string, example: about:blank}
        title: {type: string, example: Forbidden}
        status: {type: integer, example: 403}
        detail: {type: string, example: Workspace access denied}
        instance: {type: string}
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE]
        requestId: {type: string, description: Trùng header X-Request-ID}
    # Phần thông tin trang; schema danh sách = allOf [PageMeta, {items: [...]}]
    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
    AuditEntry:
      type: object
      required: [id, occurredAt, actor, action, resourceType, resource, workspace, requestId, details]
      properties:
        id: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string, example: task.complete}
        resourceType: {type: string, example: task}
        resource: {type: string}
        workspace: {type: string}
        requestId: {type: string}
        details: {type: object, additionalProperties: true}
