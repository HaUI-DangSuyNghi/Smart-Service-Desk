openapi: 3.0.3
info:
  title: DX-Lab Headless Core
  version: 0.1.0
  description: Integrated headless Core runtime. Unscanned upload is opt-in for local synthetic data only. Every response carries X-Request-ID (client/gateway UUID kept, otherwise generated).
servers:
  - url: http://localhost:9080/api/core/v1
security:
  - bearer: []
paths:
  /me:
    get:
      operationId: me
      description: Người dùng hiện tại; membership đọc từ group /workspaces/{workspace}/{role}.
      responses:
        '200':
          description: Verified identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /workspaces/{workspace}/metadata:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
    post:
      operationId: createMetadata
      description: Vai trò agent hoặc coordinator của workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewMetadata'}
      responses:
        '201':
          description: Persisted metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metadata'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      operationId: searchMetadata
      description: Tìm metadata theo tiêu đề (không phân biệt hoa thường); thành viên. (P1)
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: source, in: query, schema: {type: string, maxLength: 1000}}
        - {name: sort, in: query, schema: {type: string, enum: ['createdAt,desc', 'createdAt,asc', 'title,asc', 'title,desc'], default: 'createdAt,desc'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Một trang metadata
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMeta'}
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Metadata'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspace}/metadata/{id}:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getMetadata
      description: Thành viên bất kỳ của workspace.
      responses:
        '200':
          description: Metadata record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metadata'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workspaces/{workspace}/processes/{processKey}/instances:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - name: processKey
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: startProcess
      description: Khởi tạo quy trình; quyền theo starterRoles. initiator/workspace do server đặt. (P0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [businessKey]
              properties:
                businessKey: {type: string, minLength: 1, maxLength: 200}
                title: {type: string, maxLength: 200, description: Legacy shorthand for variables.title; supply only once}
                # Chỉ các tên trong allowedStartVariables của quy trình
                variables:
                  type: object
                  additionalProperties: {type: string, maxLength: 2000}
      responses:
        '201':
          description: Đã khởi tạo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessRef'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /workspaces/{workspace}/instances/{id}/tasks:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/Instance'}
    get:
      operationId: listTasks
      description: Task đang mở của một quy trình; ai xem được lịch sử thì xem được. (P0)
      responses:
        '200':
          description: Task đang mở
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /workspaces/{workspace}/instances/{id}/tasks/{taskId}/complete:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/Instance'}
      - {$ref: '#/components/parameters/TaskId'}
    post:
      operationId: completeTask
      description: Hoàn thành task; chỉ người đang giữ. Sai bước hoặc gửi lặp → 409. (P0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedTaskKey, outcome]
              properties:
                expectedTaskKey: {type: string, minLength: 1, maxLength: 100}
                # Phải thuộc outcomesByTask của bước này
                outcome: {type: string, minLength: 1, maxLength: 100}
                comment: {type: string, maxLength: 1000}
      responses:
        '204': {description: Đã hoàn thành}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /workspaces/{workspace}/instances/{id}/history:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/Instance'}
    get:
      operationId: history
      description: Lịch sử quy trình; người khởi tạo, người đã tham gia, coordinator. (P0)
      responses:
        '200':
          description: Lịch sử từ Flowable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessHistory'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /workspaces/{workspace}/audit:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
    get:
      operationId: searchAudit
      description: Đọc audit, mới nhất trước; coordinator của workspace hoặc platform-admin.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: action, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Một trang audit
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMeta'}
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /process-definitions:
    get:
      operationId: listProcessDefinitions
      description: Quy trình đã đăng ký và vai trò được khởi tạo. (P1)
      responses:
        '200':
          description: Danh sách quy trình
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProcessDefinition'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /workspaces/{workspace}/tasks:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
    get:
      operationId: inbox
      description: Inbox. assigned = task mình đang giữ; candidate = task chưa ai nhận của nhóm mình. (P0)
      parameters:
        - name: scope
          in: query
          required: false
          schema: {type: string, enum: [assigned, candidate], default: assigned}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Một trang task
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMeta'}
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Task'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /workspaces/{workspace}/instances/{id}/tasks/{taskId}/claim:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/Instance'}
      - {$ref: '#/components/parameters/TaskId'}
    post:
      operationId: claimTask
      description: Nhận task; phải thuộc candidate group. Hai người claim cùng lúc → một người 409. (P0)
      responses:
        '200':
          description: Task đã nhận
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /workspaces/{workspace}/files:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
    post:
      operationId: uploadFile
      description: Upload file <= 5 MiB; workspace member. Disabled by default pending scanning approval; local synthetic-data Compose explicitly opts in.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: Đã lưu
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoredFile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}

  /workspaces/{workspace}/files/{fileId}:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/FileId'}
    get:
      operationId: describeFile
      description: Thông tin file; quyền đọc theo mục 7.3 (không được đọc → 404). (P0)
      responses:
        '200':
          description: Thông tin file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoredFile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /workspaces/{workspace}/files/{fileId}/content:
    parameters:
      - {$ref: '#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/FileId'}
    get:
      operationId: downloadFile
      description: Requires document:download and file access policy. Always attachment and nosniff. Requesters have preview permission only.
      responses:
        '200':
          description: Nội dung file
          headers:
            Content-Disposition: {schema: {type: string}}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Workspace:
      name: workspace
      in: path
      required: true
      schema: {type: string, example: lab-a}
    Instance:
      name: id
      in: path
      required: true
      schema: {type: string}
    # Phân trang dùng chung: ?page=0&size=20
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string}
    FileId:
      name: fileId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Unauthorized:
      description: UNAUTHENTICATED – thiếu/sai/hết hạn token
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Forbidden:
      description: FORBIDDEN – không thuộc workspace hoặc thiếu vai trò
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound:
      description: Resource not found in caller scope
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Conflict:
      description: Duplicate business key or task transition is no longer valid
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    BadRequest:
      description: Invalid input or unknown JSON property
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE – file vượt 5 MiB
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE – loại file không cho phép
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    NewMetadata:
      type: object
      additionalProperties: false
      required: [title, source, version, usageRights]
      description: "Bắt buộc đúng một trong hai: checksum hoặc fileId. Cung cấp cả hai hoặc thiếu cả hai -> 400 VALIDATION_FAILED."
      oneOf:
        - required: [checksum]
        - required: [fileId]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        source: {type: string, minLength: 1, maxLength: 1000, description: "Xuất xứ: Tự soạn, tên đơn vị/tác giả hoặc đường dẫn tài liệu gốc."}
        version: {type: string, minLength: 1, maxLength: 100}
        usageRights: {type: string, minLength: 1, maxLength: 200, description: "PUBLIC: mọi thành viên workspace có quyền xem tài liệu. INTERNAL: chỉ agent/coordinator có vai trò hiện hành hoặc platform-admin đã xác thực và là thành viên workspace. Nhãn giấy phép cũ vẫn được chấp nhận."}
        checksum: {type: string, pattern: '^[a-f0-9]{64}$'}
        fileId: {type: string, format: uuid}
    Metadata:
      type: object
      required: [id, workspace, title, source, version, usageRights, checksum, fileId, owner, createdAt]
      properties:
        id: {type: string, format: uuid}
        workspace: {type: string}
        title: {type: string}
        source: {type: string}
        version: {type: string}
        usageRights: {type: string, description: "PUBLIC hoặc INTERNAL; bản ghi cũ có thể chứa nhãn giấy phép. Phạm vi đọc được kiểm ở metadata và file gốc."}
        checksum: {type: string}
        fileId: {type: string, format: uuid, nullable: true}
        owner: {type: string}
        createdAt: {type: string, format: date-time}
    Me:
      type: object
      required: [sub, username, memberships, platformAdmin]
      properties:
        sub: {type: string}
        username: {type: string}
        memberships: {type: array, items: {$ref: '#/components/schemas/Membership'}}
        platformAdmin: {type: boolean}
    Membership:
      type: object
      required: [workspace, role]
      properties:
        workspace: {type: string, pattern: '^[a-z0-9-]{1,50}$'}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
    # Mặc định requester/agent/coordinator; thêm role = thêm group Keycloak, không sửa Core
    WorkspaceRole:
      type: string
      pattern: '^[a-z0-9-]{1,30}$'
      example: coordinator
    # Shared RFC 9457 error body for the integrated runtime.
    Problem:
      type: object
      required: [title, status, code, requestId]
      properties:
        type: {type: string, example: about:blank}
        title: {type: string, example: Forbidden}
        status: {type: integer, example: 403}
        detail: {type: string, example: Workspace access denied}
        instance: {type: string}
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, SERVICE_UNAVAILABLE]
        requestId: {type: string, description: Trùng header X-Request-ID}
    # Phần thông tin trang; schema danh sách = allOf [PageMeta, {items: [...]}]
    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
    AuditEntry:
      type: object
      required: [id, occurredAt, actor, action, resourceType, resource, workspace, requestId, details]
      properties:
        id: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string, example: task.complete}
        resourceType: {type: string, example: task}
        resource: {type: string}
        workspace: {type: string}
        requestId: {type: string}
        details: {type: object, additionalProperties: true}
    ProcessDefinition:
      type: object
      required: [processKey, starterRoles, allowedStartVariables, outcomesByTask]
      properties:
        processKey: {type: string}
        starterRoles: {type: array, items: {$ref: '#/components/schemas/WorkspaceRole'}}
        allowedStartVariables: {type: array, items: {type: string}}
        # taskKey → các outcome hợp lệ
        outcomesByTask:
          type: object
          additionalProperties: {type: array, items: {type: string}}
    ProcessRef:
      type: object
      required: [processInstanceId, processKey, businessKey, workspace]
      properties:
        id: {type: string, description: Legacy alias of processInstanceId}
        processInstanceId: {type: string}
        processKey: {type: string}
        businessKey: {type: string}
        workspace: {type: string}
    Task:
      type: object
      required: [id, processInstanceId, key, name, candidateGroups, createdAt]
      properties:
        id: {type: string}
        processInstanceId: {type: string}
        key: {type: string, description: id của userTask trong BPMN}
        name: {type: string}
        candidateGroups: {type: array, items: {type: string, example: 'lab-a:coordinator'}}
        assignee: {type: string, nullable: true, description: null nếu chưa ai nhận}
        createdAt: {type: string, format: date-time}
    ProcessHistory:
      type: object
      required: [id, processKey, businessKey, workspace, initiator, startedAt, currentTasks, steps, variables]
      properties:
        ended: {type: boolean, description: Legacy completion flag}
        tasks: {type: array, description: Legacy alias of steps, items: {$ref: '#/components/schemas/HistoryStep'}}
        id: {type: string}
        processKey: {type: string}
        businessKey: {type: string}
        workspace: {type: string}
        initiator: {type: string}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time, nullable: true}
        currentTasks: {type: array, items: {$ref: '#/components/schemas/Task'}}
        steps: {type: array, items: {$ref: '#/components/schemas/HistoryStep'}}
        variables:
          type: object
          description: Nội dung nhập lúc start, chỉ biến trong allowedStartVariables
          additionalProperties: {type: string}
    HistoryStep:
      type: object
      required: [key, name, startedAt]
      properties:
        id: {type: string}
        actor: {type: string, nullable: true, description: Legacy alias of assignee}
        key: {type: string}
        name: {type: string}
        assignee: {type: string, nullable: true}
        outcome: {type: string, nullable: true}
        comment: {type: string, nullable: true}
        startedAt: {type: string, format: date-time}
        claimedAt: {type: string, format: date-time, nullable: true}
        endedAt: {type: string, format: date-time, nullable: true}
    StoredFile:
      type: object
      required: [id, workspace, originalName, mediaType, size, checksum, owner, createdAt]
      properties:
        id: {type: string, format: uuid}
        workspace: {type: string}
        originalName: {type: string}
        mediaType: {type: string, enum: [application/pdf, text/plain, text/markdown, image/png, image/jpeg]}
        size: {type: integer, format: int64, maximum: 5242880}
        checksum: {type: string}
        owner: {type: string}
        createdAt: {type: string, format: date-time}
