# BẢN ĐÍCH – CHƯA CÀI ĐẶT. API thật đang chạy xem core.yaml.
# Cài xong endpoint nào thì chuyển endpoint đó sang core.yaml trong cùng PR.
# Schema dùng chung (Problem, PageMeta, Page, Size) lấy từ core.yaml.
openapi: 3.0.3
info:
  title: DX-Lab Headless Core (bản đích)
  version: 0.2.0-draft
  description: Hợp đồng REST đích của Tầng 1. Chưa cài đặt; dùng để FE/BE làm song song.
servers:
  - url: http://localhost:9080/api/core/v1
security:
  - bearer: []
paths:
  /process-definitions:
    get:
      operationId: listProcessDefinitions
      description: Quy trình đã đăng ký và vai trò được khởi tạo. (P1)
      responses:
        '200':
          description: Danh sách quy trình
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProcessDefinition'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /workspaces/{workspace}/processes/{processKey}/instances:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - name: processKey
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: startProcess
      description: Khởi tạo quy trình; quyền theo starterRoles. initiator/workspace do server đặt. (P0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [businessKey]
              properties:
                businessKey: {type: string, minLength: 1, maxLength: 200}
                # Chỉ các tên trong allowedStartVariables của quy trình
                variables:
                  type: object
                  additionalProperties: {type: string, maxLength: 200}
      responses:
        '201':
          description: Đã khởi tạo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessRef'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /workspaces/{workspace}/tasks:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
    get:
      operationId: inbox
      description: Inbox. assigned = task mình đang giữ; candidate = task chưa ai nhận của nhóm mình. (P0)
      parameters:
        - name: scope
          in: query
          required: true
          schema: {type: string, enum: [assigned, candidate]}
        - {$ref: 'core.yaml#/components/parameters/Page'}
        - {$ref: 'core.yaml#/components/parameters/Size'}
      responses:
        '200':
          description: Một trang task
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: 'core.yaml#/components/schemas/PageMeta'}
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Task'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /workspaces/{workspace}/instances/{id}/tasks:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: 'core.yaml#/components/parameters/Instance'}
    get:
      operationId: listTasks
      description: Task đang mở của một quy trình; ai xem được lịch sử thì xem được. (P0)
      responses:
        '200':
          description: Task đang mở
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /workspaces/{workspace}/instances/{id}/tasks/{taskId}/claim:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: 'core.yaml#/components/parameters/Instance'}
      - {$ref: '#/components/parameters/TaskId'}
    post:
      operationId: claimTask
      description: Nhận task; phải thuộc candidate group. Hai người claim cùng lúc → một người 409. (P0)
      responses:
        '200':
          description: Task đã nhận
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /workspaces/{workspace}/instances/{id}/tasks/{taskId}/complete:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: 'core.yaml#/components/parameters/Instance'}
      - {$ref: '#/components/parameters/TaskId'}
    post:
      operationId: completeTask
      description: Hoàn thành task; chỉ người đang giữ. Sai bước hoặc gửi lặp → 409. (P0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedTaskKey]
              properties:
                expectedTaskKey: {type: string, minLength: 1, maxLength: 100}
                # Phải thuộc outcomesByTask của bước này
                outcome: {type: string, maxLength: 50}
                comment: {type: string, maxLength: 1000}
      responses:
        '204': {description: Đã hoàn thành}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /workspaces/{workspace}/instances/{id}/tasks/{taskId}/assign:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: 'core.yaml#/components/parameters/Instance'}
      - {$ref: '#/components/parameters/TaskId'}
    post:
      operationId: assignTask
      description: Coordinator giao task cho người khác. (P2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignee]
              properties:
                assignee: {type: string, description: sub của người nhận}
      responses:
        '200':
          description: Task đã giao
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /workspaces/{workspace}/instances/{id}/history:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: 'core.yaml#/components/parameters/Instance'}
    get:
      operationId: history
      description: Lịch sử quy trình; người khởi tạo, người đã tham gia, coordinator. (P0)
      responses:
        '200':
          description: Lịch sử từ Flowable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessHistory'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /workspaces/{workspace}/metadata:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
    post:
      operationId: createMetadata
      description: Tạo metadata; agent hoặc coordinator. (P0)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewMetadata'}
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metadata'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    get:
      operationId: searchMetadata
      description: Tìm metadata theo tiêu đề (không phân biệt hoa thường); thành viên. (P1)
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: source, in: query, schema: {type: string, maxLength: 1000}}
        - {$ref: 'core.yaml#/components/parameters/Page'}
        - {$ref: 'core.yaml#/components/parameters/Size'}
      responses:
        '200':
          description: Một trang metadata
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: 'core.yaml#/components/schemas/PageMeta'}
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Metadata'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /workspaces/{workspace}/metadata/{metadataId}:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {name: metadataId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getMetadata
      description: Đọc metadata; thành viên. (P0)
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metadata'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /workspaces/{workspace}/files:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
    post:
      operationId: uploadFile
      description: Upload file ≤ 5 MiB, loại pdf/txt/md/png/jpeg; thành viên. (P0)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: Đã lưu
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoredFile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}

  /workspaces/{workspace}/files/{fileId}:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/FileId'}
    get:
      operationId: describeFile
      description: Thông tin file; quyền đọc theo mục 7.3 (không được đọc → 404). (P0)
      responses:
        '200':
          description: Thông tin file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoredFile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /workspaces/{workspace}/files/{fileId}/content:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/FileId'}
    get:
      operationId: downloadFile
      description: Tải nội dung; luôn Content-Disposition attachment và nosniff. (P0)
      responses:
        '200':
          description: Nội dung file
          headers:
            Content-Disposition: {schema: {type: string}}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string}
    FileId:
      name: fileId
      in: path
      required: true
      schema: {type: string, format: uuid}
  # Mọi lỗi trả body Problem (code + requestId)
  responses:
    BadRequest:
      description: VALIDATION_FAILED – sai định dạng, thiếu trường, có trường lạ
      content: {application/problem+json: {schema: {$ref: 'core.yaml#/components/schemas/Problem'}}}
    Unauthorized:
      description: UNAUTHENTICATED – thiếu/sai/hết hạn token
      content: {application/problem+json: {schema: {$ref: 'core.yaml#/components/schemas/Problem'}}}
    Forbidden:
      description: FORBIDDEN – không thuộc workspace hoặc thiếu vai trò
      content: {application/problem+json: {schema: {$ref: 'core.yaml#/components/schemas/Problem'}}}
    NotFound:
      description: NOT_FOUND – không tồn tại hoặc người gọi không được biết
      content: {application/problem+json: {schema: {$ref: 'core.yaml#/components/schemas/Problem'}}}
    Conflict:
      description: CONFLICT – trùng business key, task đã bị nhận, sai bước, gửi lặp
      content: {application/problem+json: {schema: {$ref: 'core.yaml#/components/schemas/Problem'}}}
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE – file vượt 5 MiB
      content: {application/problem+json: {schema: {$ref: 'core.yaml#/components/schemas/Problem'}}}
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE – loại file không cho phép
      content: {application/problem+json: {schema: {$ref: 'core.yaml#/components/schemas/Problem'}}}
  schemas:
    ProcessDefinition:
      type: object
      required: [processKey, starterRoles, allowedStartVariables, outcomesByTask]
      properties:
        processKey: {type: string}
        starterRoles: {type: array, items: {$ref: 'core.yaml#/components/schemas/WorkspaceRole'}}
        allowedStartVariables: {type: array, items: {type: string}}
        # taskKey → các outcome hợp lệ
        outcomesByTask:
          type: object
          additionalProperties: {type: array, items: {type: string}}
    ProcessRef:
      type: object
      required: [processInstanceId, processKey, businessKey, workspace]
      properties:
        processInstanceId: {type: string}
        processKey: {type: string}
        businessKey: {type: string}
        workspace: {type: string}
    Task:
      type: object
      required: [id, processInstanceId, key, name, candidateGroups, createdAt]
      properties:
        id: {type: string}
        processInstanceId: {type: string}
        key: {type: string, description: id của userTask trong BPMN}
        name: {type: string}
        candidateGroups: {type: array, items: {type: string, example: 'lab-a:coordinator'}}
        assignee: {type: string, nullable: true, description: null nếu chưa ai nhận}
        createdAt: {type: string, format: date-time}
    ProcessHistory:
      type: object
      required: [id, processKey, businessKey, workspace, initiator, startedAt, currentTasks, steps]
      properties:
        id: {type: string}
        processKey: {type: string}
        businessKey: {type: string}
        workspace: {type: string}
        initiator: {type: string}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time, nullable: true}
        currentTasks: {type: array, items: {$ref: '#/components/schemas/Task'}}
        steps: {type: array, items: {$ref: '#/components/schemas/HistoryStep'}}
    HistoryStep:
      type: object
      required: [key, name, startedAt]
      properties:
        key: {type: string}
        name: {type: string}
        assignee: {type: string, nullable: true}
        outcome: {type: string, nullable: true}
        comment: {type: string, nullable: true}
        startedAt: {type: string, format: date-time}
        claimedAt: {type: string, format: date-time, nullable: true}
        endedAt: {type: string, format: date-time, nullable: true}
    NewMetadata:
      type: object
      additionalProperties: false
      required: [title, source, version, usageRights]
      # Không có fileId thì bắt buộc checksum; có fileId thì không gửi checksum (server tự tính)
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        source: {type: string, minLength: 1, maxLength: 1000}
        version: {type: string, minLength: 1, maxLength: 100}
        usageRights: {type: string, minLength: 1, maxLength: 200}
        checksum: {type: string, pattern: '^[a-f0-9]{64}$'}
        fileId: {type: string, format: uuid}
    Metadata:
      type: object
      required: [id, workspace, title, source, version, usageRights, checksum, owner, createdAt]
      properties:
        id: {type: string, format: uuid}
        workspace: {type: string}
        title: {type: string}
        source: {type: string}
        version: {type: string}
        usageRights: {type: string}
        checksum: {type: string}
        fileId: {type: string, format: uuid, nullable: true}
        owner: {type: string}
        createdAt: {type: string, format: date-time}
    StoredFile:
      type: object
      required: [id, workspace, originalName, mediaType, size, checksum, owner, createdAt]
      properties:
        id: {type: string, format: uuid}
        workspace: {type: string}
        originalName: {type: string}
        mediaType: {type: string, enum: [application/pdf, text/plain, text/markdown, image/png, image/jpeg]}
        size: {type: integer, format: int64, maximum: 5242880}
        checksum: {type: string}
        owner: {type: string}
        createdAt: {type: string, format: date-time}
