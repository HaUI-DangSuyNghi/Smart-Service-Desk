openapi: 3.0.3
info:
  title: Smart Service Desk Ticket Foundation
  version: 0.1.0
  description: Application API. Core owns authentication, workflow and audit. No AI bridge or private attachments.
servers:
  - url: http://localhost:9080/api/apps/servicedesk/v1
security:
  - bearer: []
paths:
  /workspaces/{workspace}/tickets:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
    post:
      operationId: createTicket
      description: Requester/agent/coordinator. Creator is the authenticated subject. Duplicate clientRequestId per creator/workspace returns 409, including concurrent requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewTicket'}
      responses:
        '201':
          description: Ticket, process scope, engine state and audit committed together.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
        '404': {$ref: 'core.yaml#/components/responses/NotFound'}
        '409': {$ref: 'core.yaml#/components/responses/Conflict'}
    get:
      operationId: searchTickets
      description: Requester sees own tickets; agent/coordinator sees workspace tickets. Stable newest-first ordering by createdAt and id.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}, description: Case-insensitive literal substring in title or description; no wildcard syntax.}
        - {$ref: 'core.yaml#/components/parameters/Page'}
        - {$ref: 'core.yaml#/components/parameters/Size'}
      responses:
        '200':
          description: Authorized tickets only; total uses the same access filter.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketPage'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
  /workspaces/{workspace}/tickets/{id}:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/TicketId'}
    get:
      operationId: getTicket
      description: Same visibility as list. Missing or hidden ticket returns 404. No stored status; use progress and Core inbox.
      responses:
        '200':
          description: Persisted ticket with canonical process reference.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
        '404': {$ref: 'core.yaml#/components/responses/NotFound'}
  /workspaces/{workspace}/tickets/{id}/progress:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/TicketId'}
    get:
      operationId: getTicketProgress
      description: Ticket visibility plus unchanged Core history policy. Before claim an unrelated agent gets 404; discover work using Core candidate inbox, then claim. Creator, coordinator or prior assignee can read history.
      responses:
        '200':
          description: Live Flowable history. handle resolved leads to confirm; confirm accepted ends, rework returns to handle.
          content:
            application/json:
              schema: {$ref: 'core.yaml#/components/schemas/ProcessHistory'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
        '404': {$ref: 'core.yaml#/components/responses/NotFound'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    NewTicket:
      type: object
      additionalProperties: false
      required: [clientRequestId, title, description]
      properties:
        clientRequestId: {type: string, format: uuid, description: 'Submission key, not the X-Request-ID tracing header.'}
        title: {type: string, minLength: 1, maxLength: 200, description: Nonblank; no control characters.}
        description: {type: string, minLength: 1, maxLength: 4000, description: Nonblank; only tab/CR/LF control characters permitted.}
    Ticket:
      type: object
      additionalProperties: false
      required: [id, workspace, creator, clientRequestId, title, description, createdAt, process]
      properties:
        id: {type: string, format: uuid}
        workspace: {type: string}
        creator: {type: string}
        clientRequestId: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        createdAt: {type: string, format: date-time}
        process: {$ref: 'core.yaml#/components/schemas/ProcessRef'}
    TicketPage:
      allOf:
        - {$ref: 'core.yaml#/components/schemas/PageMeta'}
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
