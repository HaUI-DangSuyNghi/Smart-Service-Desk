openapi: 3.0.3
info:
  title: Smart Service Desk Ticket Foundation
  version: 0.1.0
  description: Application API. Core owns authentication, workflow and audit. Triage is transient and never changes Ticket or Workflow state. Private attachments are out of scope.
servers:
  - url: http://localhost:9080/api/apps/servicedesk/v1
security:
  - bearer: []
paths:
  /workspaces/{workspace}/tickets/{id}/triage:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/TicketId'}
    post:
      operationId: triageTicket
      description: 'No request body is allowed: any body bytes, including {}, return 400. Requester sees own tickets; agent/coordinator sees workspace tickets. Input and profile are server-selected. The response is validated against contracts/intelligence/v1/triage-result.schema.json plus correlation, pinned profile and literal evidence checks. SUCCESS is advice only. DEGRADED has null result/explanation/runtime, empty evidence and needsReview=true. Never infer authorization or workflow actions from a suggestion.'
      responses:
        '200':
          description: Valid logical SUCCESS or DEGRADED envelope, unchanged. Neither is a confirmed business decision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TriageResponse'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
        '404': {$ref: 'core.yaml#/components/responses/NotFound'}
        '502':
          description: Upstream contract failure or integration authentication/configuration failure; never an end-user login challenge.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/TriageProblem'}
        '503':
          description: AI not configured, connection failure, upstream 429 or upstream 5xx. Manual workflow remains available.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/TriageProblem'}
        '504':
          description: AI overall HTTP deadline exceeded, including response-body transfer.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/TriageProblem'}
  /workspaces/{workspace}/tickets:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
    post:
      operationId: createTicket
      description: Requester/agent/coordinator. Creator is the authenticated subject. Duplicate clientRequestId per creator/workspace returns 409, including concurrent requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewTicket'}
      responses:
        '201':
          description: Ticket, process scope, engine state and audit committed together.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
        '404': {$ref: 'core.yaml#/components/responses/NotFound'}
        '409': {$ref: 'core.yaml#/components/responses/Conflict'}
    get:
      operationId: searchTickets
      description: Requester sees own tickets; agent/coordinator sees workspace tickets. Stable newest-first ordering by createdAt and id.
      parameters:
        - {$ref: '#/components/parameters/Query'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: 'core.yaml#/components/parameters/Page'}
        - {$ref: 'core.yaml#/components/parameters/Size'}
      responses:
        '200':
          description: Authorized tickets only; total uses the same access filter.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketPage'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
  /workspaces/{workspace}/tickets/statistics:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
    get:
      operationId: getTicketStatistics
      description: One workspace only. Requester counts own tickets; agent/coordinator counts workspace tickets, including tasks not yet claimed. Filters match Ticket List. Current workflow states of tickets created in the selected interval, not historical completion counts. No caching or separate status storage.
      parameters:
        - {$ref: '#/components/parameters/Query'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200':
          description: Single database snapshot; total equals the sum of the four mutually exclusive state counts. Empty results have all counts zero.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketStatistics'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
  /workspaces/{workspace}/tickets/{id}:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/TicketId'}
    get:
      operationId: getTicket
      description: Same visibility as list. Missing or hidden ticket returns 404. No stored status; use progress and Core inbox.
      responses:
        '200':
          description: Persisted ticket with canonical process reference.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
        '404': {$ref: 'core.yaml#/components/responses/NotFound'}
  /workspaces/{workspace}/tickets/{id}/progress:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/TicketId'}
    get:
      operationId: getTicketProgress
      description: Ticket visibility plus unchanged Core history policy. Before claim an unrelated agent gets 404; discover work using Core candidate inbox, then claim. Creator, coordinator or prior assignee can read history.
      responses:
        '200':
          description: Live Flowable history. handle resolved leads to confirm; confirm accepted ends, rework returns to handle.
          content:
            application/json:
              schema: {$ref: 'core.yaml#/components/schemas/ProcessHistory'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
        '404': {$ref: 'core.yaml#/components/responses/NotFound'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Query:
      name: q
      in: query
      description: Case-insensitive literal substring in title or description; no wildcard syntax or control characters. Empty or omitted matches all visible tickets.
      schema: {type: string, maxLength: 200}
    From:
      name: from
      in: query
      description: Inclusive ticket createdAt lower bound, RFC3339 with timezone. Years 0001-9999, at most microsecond precision. Must precede to when both are supplied.
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      description: Exclusive ticket createdAt upper bound, RFC3339 with timezone. Years 0001-9999, at most microsecond precision. Omitted bounds are unbounded.
      schema: {type: string, format: date-time}
    TicketId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    TriageProblem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer, enum: [502, 503, 504]}
        detail: {type: string}
        instance: {type: string}
        requestId: {type: string}
        code: {type: string, enum: [INTELLIGENCE_CONTRACT_FAILED, INTELLIGENCE_INTEGRATION_FAILED, INTELLIGENCE_UNAVAILABLE, INTELLIGENCE_TIMEOUT]}
    TriageResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, requestId, profile, workspaceId, status, result, evidence, explanation, runtime, needsReview, error]
      properties:
        contractVersion: {type: string, enum: ['0.1.0']}
        requestId: {type: string, minLength: 1}
        profile: {type: string, enum: [service-desk]}
        workspaceId: {type: string, minLength: 1}
        status: {type: string, enum: [SUCCESS, DEGRADED]}
        needsReview: {type: boolean}
        result:
          type: object
          nullable: true
          additionalProperties: false
          required: [category, priority, suggestedGroup]
          properties:
            category: {type: string, minLength: 1}
            priority: {type: string, minLength: 1}
            suggestedGroup: {type: string, minLength: 1}
        evidence:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, field, text]
            properties:
              type: {type: string, enum: [INPUT]}
              field: {type: string, enum: [title, description]}
              text: {type: string, minLength: 1}
        explanation:
          type: object
          nullable: true
          additionalProperties: false
          required: [matchedRules, impact, urgency, reasonCode, text]
          properties:
            matchedRules: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
            impact: {type: string, nullable: true}
            urgency: {type: string, nullable: true}
            reasonCode: {type: string, enum: [CLASSIFIED, ROOT_CAUSE_CONFLICT, INSUFFICIENT_INFORMATION]}
            text: {type: string, minLength: 1}
        runtime:
          type: object
          nullable: true
          additionalProperties: false
          required: [engine, profileVersion]
          properties:
            engine: {type: string, minLength: 1}
            profileVersion: {type: string, enum: ['service-desk@0.2.0']}
            rulesVersion: {type: string, minLength: 1}
            modelVersion: {type: string, minLength: 1}
        error:
          type: object
          nullable: true
          additionalProperties: false
          required: [code]
          properties:
            code: {type: string, enum: [INTELLIGENCE_UNAVAILABLE]}
    TicketStatistics:
      type: object
      additionalProperties: false
      required: [workspace, visibility, total, awaitingHandling, awaitingConfirmation, completed, unclassified]
      properties:
        workspace: {type: string}
        visibility: {type: string, enum: [own, workspace]}
        total: {type: integer, format: int64, minimum: 0}
        awaitingHandling: {type: integer, format: int64, minimum: 0, description: Exactly one active handle task; includes claimed tasks.}
        awaitingConfirmation: {type: integer, format: int64, minimum: 0, description: Exactly one active confirm task.}
        completed: {type: integer, format: int64, minimum: 0, description: Normal service-desk end event in Flowable history and no runtime tasks; excludes deleted processes.}
        unclassified: {type: integer, format: int64, minimum: 0, description: 'Missing or mismatched scope/history, suspended, deleted or unexpected task configuration; never assumed completed.'}
    NewTicket:
      type: object
      additionalProperties: false
      required: [clientRequestId, title, description]
      properties:
        clientRequestId: {type: string, format: uuid, description: 'Submission key, not the X-Request-ID tracing header.'}
        title: {type: string, minLength: 1, maxLength: 200, description: Nonblank; no control characters.}
        description: {type: string, minLength: 1, maxLength: 4000, description: Nonblank; only tab/CR/LF control characters permitted.}
    Ticket:
      type: object
      additionalProperties: false
      required: [id, workspace, creator, clientRequestId, title, description, createdAt, process]
      properties:
        id: {type: string, format: uuid}
        workspace: {type: string}
        creator: {type: string}
        clientRequestId: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        createdAt: {type: string, format: date-time}
        process: {$ref: 'core.yaml#/components/schemas/ProcessRef'}
    TicketPage:
      allOf:
        - {$ref: 'core.yaml#/components/schemas/PageMeta'}
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
