openapi: 3.0.3
info:
  title: Smart Service Desk Ticket Foundation
  version: 0.1.0
  description: Application API. Core owns authentication, workflow and audit. No AI bridge or private attachments.
servers:
  - url: http://localhost:9080/api/apps/servicedesk/v1
security:
  - bearer: []
paths:
  /workspaces/{workspace}/tickets:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
    post:
      operationId: createTicket
      description: Requester/agent/coordinator. Creator is the authenticated subject. Duplicate clientRequestId per creator/workspace returns 409, including concurrent requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewTicket'}
      responses:
        '201':
          description: Ticket, process scope, engine state and audit committed together.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
        '404': {$ref: 'core.yaml#/components/responses/NotFound'}
        '409': {$ref: 'core.yaml#/components/responses/Conflict'}
    get:
      operationId: searchTickets
      description: Requester sees own tickets; agent/coordinator sees workspace tickets. Stable newest-first ordering by createdAt and id.
      parameters:
        - {$ref: '#/components/parameters/Query'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: 'core.yaml#/components/parameters/Page'}
        - {$ref: 'core.yaml#/components/parameters/Size'}
      responses:
        '200':
          description: Authorized tickets only; total uses the same access filter.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketPage'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
  /workspaces/{workspace}/tickets/statistics:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
    get:
      operationId: getTicketStatistics
      description: One workspace only. Requester counts own tickets; agent/coordinator counts workspace tickets, including tasks not yet claimed. Filters match Ticket List. Current workflow states of tickets created in the selected interval, not historical completion counts. No caching or separate status storage.
      parameters:
        - {$ref: '#/components/parameters/Query'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200':
          description: Single database snapshot; total equals the sum of the four mutually exclusive state counts. Empty results have all counts zero.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketStatistics'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
  /workspaces/{workspace}/tickets/{id}:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/TicketId'}
    get:
      operationId: getTicket
      description: Same visibility as list. Missing or hidden ticket returns 404. No stored status; use progress and Core inbox.
      responses:
        '200':
          description: Persisted ticket with canonical process reference.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
        '404': {$ref: 'core.yaml#/components/responses/NotFound'}
  /workspaces/{workspace}/tickets/{id}/progress:
    parameters:
      - {$ref: 'core.yaml#/components/parameters/Workspace'}
      - {$ref: '#/components/parameters/TicketId'}
    get:
      operationId: getTicketProgress
      description: Ticket visibility plus unchanged Core history policy. Before claim an unrelated agent gets 404; discover work using Core candidate inbox, then claim. Creator, coordinator or prior assignee can read history.
      responses:
        '200':
          description: Live Flowable history. handle resolved leads to confirm; confirm accepted ends, rework returns to handle.
          content:
            application/json:
              schema: {$ref: 'core.yaml#/components/schemas/ProcessHistory'}
        '400': {$ref: 'core.yaml#/components/responses/BadRequest'}
        '401': {$ref: 'core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: 'core.yaml#/components/responses/Forbidden'}
        '404': {$ref: 'core.yaml#/components/responses/NotFound'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Query:
      name: q
      in: query
      description: Case-insensitive literal substring in title or description; no wildcard syntax or control characters. Empty or omitted matches all visible tickets.
      schema: {type: string, maxLength: 200}
    From:
      name: from
      in: query
      description: Inclusive ticket createdAt lower bound, RFC3339 with timezone. Years 0001-9999, at most microsecond precision. Must precede to when both are supplied.
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      description: Exclusive ticket createdAt upper bound, RFC3339 with timezone. Years 0001-9999, at most microsecond precision. Omitted bounds are unbounded.
      schema: {type: string, format: date-time}
    TicketId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    TicketStatistics:
      type: object
      additionalProperties: false
      required: [workspace, visibility, total, awaitingHandling, awaitingConfirmation, completed, unclassified]
      properties:
        workspace: {type: string}
        visibility: {type: string, enum: [own, workspace]}
        total: {type: integer, format: int64, minimum: 0}
        awaitingHandling: {type: integer, format: int64, minimum: 0, description: Exactly one active handle task; includes claimed tasks.}
        awaitingConfirmation: {type: integer, format: int64, minimum: 0, description: Exactly one active confirm task.}
        completed: {type: integer, format: int64, minimum: 0, description: Normal service-desk end event in Flowable history and no runtime tasks; excludes deleted processes.}
        unclassified: {type: integer, format: int64, minimum: 0, description: 'Missing or mismatched scope/history, suspended, deleted or unexpected task configuration; never assumed completed.'}
    NewTicket:
      type: object
      additionalProperties: false
      required: [clientRequestId, title, description]
      properties:
        clientRequestId: {type: string, format: uuid, description: 'Submission key, not the X-Request-ID tracing header.'}
        title: {type: string, minLength: 1, maxLength: 200, description: Nonblank; no control characters.}
        description: {type: string, minLength: 1, maxLength: 4000, description: Nonblank; only tab/CR/LF control characters permitted.}
    Ticket:
      type: object
      additionalProperties: false
      required: [id, workspace, creator, clientRequestId, title, description, createdAt, process]
      properties:
        id: {type: string, format: uuid}
        workspace: {type: string}
        creator: {type: string}
        clientRequestId: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        createdAt: {type: string, format: date-time}
        process: {$ref: 'core.yaml#/components/schemas/ProcessRef'}
    TicketPage:
      allOf:
        - {$ref: 'core.yaml#/components/schemas/PageMeta'}
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
